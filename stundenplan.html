<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070910">
<title>Stundenplan</title>
<style>
:root{
  --bg:#070910; --s1:#101521; --s2:#171F31; --ln:#252D41;
  --tx:#F4F6FF; --mt:#8893AA; --amb:#FFBD4A; --sel:#DDE2EC;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;min-height:100vh}

/* Kopf + Tage bleiben oben stehen */
.top{
  position:sticky;top:0;z-index:5;
  background:rgba(7,9,16,.94);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  padding:env(safe-area-inset-top,0px) 16px 0;
  border-bottom:1px solid var(--ln);
}
.bar{display:flex;justify-content:space-between;align-items:flex-end;padding:14px 2px 12px}
.app{font-size:20px;font-weight:800;letter-spacing:-.02em}
.sem{font-size:12px;color:var(--mt);margin-top:2px}
.clock{font-size:14px;font-weight:700;color:var(--mt);font-variant-numeric:tabular-nums;padding-bottom:2px}

.days{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:0 0 11px}
.day{
  position:relative;border:0;background:var(--s1);color:var(--tx);
  border-radius:12px;padding:8px 0 9px;font:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.day .wd{font-size:11px;font-weight:600;color:var(--mt)}
.day .dn{font-size:17px;font-weight:800;line-height:1.1}
.day.on{background:var(--sel);color:#070910}
.day.on .wd{color:#56627A}
.day .dot{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--amb)}
.day.on .dot{background:#070910}

/* Inhalt */
main{padding:18px 14px 56px}
.head{margin-bottom:16px;padding:0 2px}
.big{font-size:25px;font-weight:800;letter-spacing:-.02em}
.sub{font-size:13px;color:var(--mt);margin-top:3px}

.row{display:grid;grid-template-columns:46px 1fr;gap:10px;margin-bottom:8px}
.t{text-align:right;padding-top:11px;font-variant-numeric:tabular-nums}
.t b{display:block;font-size:13px;font-weight:700}
.t span{display:block;font-size:11px;color:var(--mt);margin-top:2px}

.card{
  background:var(--s1);border-radius:16px;
  padding:10px 12px 11px;border-left:4px solid var(--c);
}
.cat{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.cat em{font-style:normal;color:var(--amb);margin-left:6px;letter-spacing:.04em}
.name{font-size:15.5px;font-weight:700;margin-top:4px;line-height:1.25}
.meta{font-size:12px;color:var(--mt);margin-top:4px;line-height:1.3}
.meta .house{font-size:10px;color:var(--mt)}

.row.live .card{background:var(--s2);box-shadow:0 0 0 1px var(--amb)}
.row.uebung .card{background:#F3F7E9;border-left-color:#A5DB27;box-shadow:0 0 0 1px rgba(165,219,39,.38)}
.row.uebung .name{color:#141B12}
.row.uebung .meta,.row.uebung .meta .house{color:#4B5563}
.row.uebung .cat{color:#527C00}
.row.past{opacity:.5}

.now{
  display:flex;align-items:center;gap:10px;
  margin:4px 0 14px;font-size:12px;font-weight:800;
  color:var(--amb);text-transform:uppercase;letter-spacing:.06em;
}
.now::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--amb);
  box-shadow:0 0 0 4px rgba(255,189,74,.18);flex:0 0 auto}
.now::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--amb),rgba(251,191,36,0))}

.empty{color:var(--mt);font-size:15px;text-align:center;padding:56px 0}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="bar">
      <div>
        <div class="app">Stundenplan</div>
        <div class="sem">Wintersemester 2026/27</div>
      </div>
      <div class="clock" id="clock"></div>
    </div>
    <nav class="days" id="days"></nav>
  </div>

  <main id="main"></main>

</div>

, {"t": "Automatisierung Übung", "c": "uebung", "s": "2027-02-12T10:00", "e": "2027-02-12T11:30", "r": "C 408 PC-Pool", "g": "", "n": ""}, {"t": "Automatisierung Übung", "c": "uebung", "s": "2027-02-12T12:15", "e": "2027-02-12T13:45", "r": "C 408 PC-Pool", "g": "", "n": ""}];

const WD = ['Mo','Di','Mi','Do','Fr'];
const DAY_LONG = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MON_LONG = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const CAT = {
  seminar:  {label:'Seminar', color:'#8297FF'},
  uebung:   {label:'Übung',   color:'#C7FF46'},
  pruefung: {label:'Prüfung', color:'#FF6686'}
};
const HOUSE = {A:'Haus Beuth', B:'Haus Gau\u00df', C:'Haus Grashof', D:'Haus Bauwesen', E:'Haus Elsa Neumann', P:'Pr\u00e4sidium', W:'Wedding Advanced Laboratories', F:'Forum Seestra\u00dfe', K:'Haus Kurf\u00fcrstenstra\u00dfe', S:'Haus Schwedenstra\u00dfe'};

function parseLocal(s){
  const [d,t] = s.split('T');
  const [y,m,dd] = d.split('-').map(Number);
  const [h,mi] = t.split(':').map(Number);
  return new Date(y, m-1, dd, h, mi);
}
EV.forEach(e => { e._s = parseLocal(e.s); e._e = parseLocal(e.e); });
EV.sort((a,b) => a._s - b._s);

function berlinNow(){
  try { return new Date(new Date().toLocaleString('en-US', {timeZone:'Europe/Berlin'})); }
  catch(err){ return new Date(); }
}
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function hm(d){ return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function keyOf(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function roomMeta(room){
  const codes = String(room || '').match(/\b[A-Z](?=\s+\d)/g) || [];
  const houses = [...new Set(codes.map(code => HOUSE[code]).filter(Boolean))];
  return esc(room) + (houses.length ? '<small class="house"> · ' + esc(houses.join(' / ')) + '</small>' : '');
}

/* Mo–Fr der passenden Woche: am Wochenende schon die nächste Woche */
function weekDays(now){
  const wd = now.getDay();
  const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  mon.setDate(mon.getDate() - ((wd + 6) % 7));
  if (wd === 0 || wd === 6) mon.setDate(mon.getDate() + 7);
  return [0,1,2,3,4].map(i => {
    const d = new Date(mon); d.setDate(mon.getDate() + i); return d;
  });
}

let sel = null;

function row(e, now){
  const c = CAT[e.c];
  const live = e._s <= now && now < e._e;
  const past = e._e <= now;
  const meta = [e.r ? roomMeta(e.r) : '', e.g ? esc(e.g) : ''].filter(Boolean).join(' · ');
  return '<div class="row ' + e.c + (past ? ' past' : '') + (live ? ' live' : '') + '">' +
    '<div class="t"><b>' + hm(e._s) + '</b><span>' + hm(e._e) + '</span></div>' +
    '<div class="card" style="--c:' + c.color + '">' +
      '<div class="cat">' + c.label + (live ? '<em>läuft</em>' : '') + '</div>' +
      '<div class="name">' + esc(e.t) + '</div>' +
      (meta ? '<div class="meta">' + meta + '</div>' : '') +
    '</div></div>';
}

function render(){
  const now = berlinNow();
  const days = weekDays(now);
  const keys = days.map(keyOf);
  const todayKey = keyOf(now);

  if (!sel || !keys.includes(sel)){
    sel = keys.includes(todayKey) ? todayKey : keys[0];
  }

  document.getElementById('clock').textContent = hm(now);

  document.getElementById('days').innerHTML = days.map((d,i) =>
    '<button class="day' + (keys[i] === sel ? ' on' : '') + '" data-d="' + keys[i] + '">' +
      '<span class="wd">' + WD[i] + '</span>' +
      '<span class="dn">' + d.getDate() + '</span>' +
      (keys[i] === todayKey ? '<i class="dot"></i>' : '') +
    '</button>'
  ).join('');

  const idx = keys.indexOf(sel);
  const d = days[idx];
  const isToday = sel === todayKey;
  const items = EV.filter(e => keyOf(e._s) === sel);

  let html = '<div class="head"><div class="big">' + DAY_LONG[d.getDay()] + '</div>' +
    '<div class="sub">' + d.getDate() + '. ' + MON_LONG[d.getMonth()] + (isToday ? ' · heute' : '') + '</div></div>';

  if (!items.length){
    html += '<div class="empty">Kein Unterricht</div>';
  } else {
    const marker = '<div class="now"><span>Jetzt ' + hm(now) + '</span></div>';
    const cur = items.findIndex(e => e._e > now);
    items.forEach((e, i) => {
      if (isToday && i === cur) html += marker;
      html += row(e, now);
    });
    if (isToday && cur === -1) html += marker;
  }

  document.getElementById('main').innerHTML = html;
}

/* Tag antippen */
document.getElementById('days').addEventListener('click', ev => {
  const b = ev.target.closest('button[data-d]');
  if (b){ sel = b.dataset.d; render(); }
});

/* Wischen nach links/rechts wechselt den Tag */
let tx = null, ty = null;
const mainEl = document.getElementById('main');
mainEl.addEventListener('touchstart', ev => { tx = ev.touches[0].clientX; ty = ev.touches[0].clientY; }, {passive:true});
mainEl.addEventListener('touchend', ev => {
  if (tx === null) return;
  const dx = ev.changedTouches[0].clientX - tx;
  const dy = ev.changedTouches[0].clientY - ty;
  tx = null;
  if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  const keys = weekDays(berlinNow()).map(keyOf);
  const i = keys.indexOf(sel);
  const j = dx < 0 ? i + 1 : i - 1;
  if (j >= 0 && j < keys.length){ sel = keys[j]; render(); }
}, {passive:true});

render();
setInterval(render, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

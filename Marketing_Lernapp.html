<script>
const QUESTIONS=[{"pdf":1,"topic":"Marketing-Grundgedanke","q":"Was kennzeichnet Marketing als Führungsphilosophie?","o":["Ausrichtung auf Kundenbedürfnisse und Marktbedingungen","Ausrichtung auf maximale Produktion und niedrige Lagerbestände","Ausrichtung auf interne Abläufe ohne Wettbewerbsbezug","Ausrichtung auf kurzfristige Verkaufsaktionen"],"a":0,"why":"Marketing richtet das Unternehmen an Kunden, Umfeld und Wettbewerb aus.","id":"m001"},{"pdf":1,"topic":"Marketing-Grundgedanke","q":"Welche Frage gehört zur kundenorientierten Leistungsidee?","o":["Welche Abteilung erhält das größte Budget?","Warum soll ein Kunde das Angebot kaufen?","Wie viele Standorte hat der Wettbewerber?","Welche Maschine ist am schnellsten?"],"a":1,"why":"Das Warum fragt nach Kundenproblem und Kaufmotiv.","id":"m002"},{"pdf":1,"topic":"Marketing-Grundgedanke","q":"Wofür steht die Frage „An wen?“ in der Leistungsidee?","o":["Für Preis und Umsatz","Für Werbung und Vertrieb","Für Käufer und Zielgruppen","Für Absatzmärkte"],"a":2,"why":"„An wen?“ bestimmt Käufer und Zielgruppen.","id":"m003"},{"pdf":1,"topic":"Marketing-Grundgedanke","q":"Welche Reihenfolge passt zum Grundgedanken des Marketings?","o":["Ziele setzen, Märkte analysieren, Angebote entwickeln, Chancen erkennen","Märkte analysieren, Chancen erkennen, Ziele setzen, Strategien planen","Angebote verbessern, Produktion steigern, Märkte wählen, Ziele prüfen","Kunden gewinnen, Produkte planen, Konkurrenz kopieren, Preise senken"],"a":1,"why":"Aus der Analyse folgen Chancen, Ziele und Strategien; anschließend werden Angebote entwickelt und verbessert.","id":"m004"},{"pdf":1,"topic":"Marketing-Grundgedanke","q":"Was soll neben den Erwartungen der Kunden im Blick bleiben?","o":["Nur die eigene Produktionsmenge","Nur die interne Kostenrechnung","Das Umfeld und die Aktivitäten der Konkurrenz","Vor allem die Zahl der Beschäftigten"],"a":2,"why":"Marktorientierung berücksichtigt auch Umfeld und Konkurrenz.","id":"m005"},{"pdf":1,"topic":"Marketing-Grundgedanke","q":"Was meint „Wo?“ in der kundenorientierten Leistungsidee?","o":["Absatzmärkte","Kaufmotive","Produktservice","Kommunikationskanäle"],"a":0,"why":"„Wo?“ fragt nach den Absatzmärkten.","id":"m006"},{"pdf":1,"topic":"Marketing-Grundgedanke","q":"Womit bindet ein Unternehmen Kunden laut Grundgedanke?","o":["Mit möglichst vielen Produktvarianten","Mit passenden Angeboten und Kundennutzen","Mit einer einzigen Werbekampagne","Mit der Vermeidung von Kundenkontakt"],"a":1,"why":"Kundenbindung entsteht durch passende Angebote und Nutzen.","id":"m007"},{"pdf":1,"topic":"Marketing-Grundgedanke","q":"Welche Aussage grenzt Marketing am besten vom bloßen Verkaufen ab?","o":["Marketing beginnt erst nach dem Kauf.","Marketing umfasst nur Werbung und Rabatt.","Marketing ist marktorientierte Unternehmensführung.","Marketing dient nur der Absatzsteigerung im laufenden Monat."],"a":2,"why":"Marketing ist eine unternehmensweite Orientierung, keine einzelne Verkaufsmaßnahme.","id":"m008"},{"pdf":1,"topic":"Marketing-Grundgedanke","q":"Welche zwei Aspekte fasst „Was?“ bei der Leistungsidee zusammen?","o":["Produkt und Service","Käufer und Zielgruppe","Preis und Umsatz","Werbung und Vertrieb"],"a":0,"why":"„Was?“ bezeichnet die angebotene Leistung aus Produkt und Service.","id":"m009"},{"pdf":1,"topic":"Marketing-Grundgedanke","q":"Wozu analysiert ein Unternehmen Märkte?","o":["Um Chancen und Kundenprobleme zu erkennen","Um Kundenwünsche zu ersetzen","Um Konkurrenz dauerhaft auszuschließen","Um Ziele ohne weitere Prüfung festzulegen"],"a":0,"why":"Die Marktanalyse hilft, Chancen und Bedürfnisse zu erkennen.","id":"m010"},{"pdf":2,"topic":"Strategisches Marketing","q":"Welche Frage beantwortet die Situationsanalyse in der strategischen Planung?","o":["Wo stehen wir?","Wie hoch ist der Monatsumsatz?","Wer setzt die Werbung um?","Welche Maßnahme starten wir morgen?"],"a":0,"why":"Die Situationsanalyse beschreibt die Ausgangslage.","id":"m011"},{"pdf":2,"topic":"Strategisches Marketing","q":"Was ist ein zentrales Element einer Marketingstrategie?","o":["Die genaue Form jeder einzelnen Rechnung","Die Definition der Zielgruppe","Der tägliche Personaleinsatz jeder Filiale","Die Auswahl des Buchhaltungssystems"],"a":1,"why":"Eine Marketingstrategie legt fest, welche Zielgruppe angesprochen wird.","id":"m012"},{"pdf":2,"topic":"Strategisches Marketing","q":"Wofür steht USP im strategischen Marketing?","o":["Ein einmaliger Preisnachlass","Ein Alleinstellungsversprechen","Eine jährliche Umsatzplanung","Eine universelle Produktnorm"],"a":1,"why":"USP bedeutet Unique Selling Proposition, also ein besonderes Nutzenversprechen.","id":"m013"},{"pdf":2,"topic":"Strategisches Marketing","q":"Was ist die Hauptaufgabe strategischer Marketingplanung?","o":["Langfristig Erfolgspotenziale sichern","Kurzfristig einzelne Rechnungen senken","Alle Märkte gleichzeitig bedienen","Operative Kontrollen abschaffen"],"a":0,"why":"Strategische Marketingplanung entwickelt langfristige Wege zur Sicherung von Erfolgspotenzialen.","id":"m014"},{"pdf":2,"topic":"Strategisches Marketing","q":"Welche Instrumente werden durch Marketingstrategien kanalisiert?","o":["Produkt, Preis, Distribution und Kommunikation","Personal, Recht, Steuern und Produktion","Forschung, Einkauf, Buchhaltung und Logistik","Vision, Mission, Werte und Eigentum"],"a":0,"why":"Gemeint sind die klassischen vier Marketinginstrumente.","id":"m015"},{"pdf":2,"topic":"Strategisches Marketing","q":"Welche Ergänzung erweitert die 4 Ps im Dienstleistungsmarketing auf 7 Ps?","o":["Personal, physische Ausstattung und Prozesse","Planung, Positionierung und Produktivität","Prüfung, Präsentation und Personalrat","Partnerschaft, Profit und Produktlinie"],"a":0,"why":"Die drei zusätzlichen Ps sind People, Physical Facilities und Process.","id":"m016"},{"pdf":2,"topic":"Strategisches Marketing","q":"Was kennzeichnet Planung laut Vorlesung?","o":["Zukunftsgerichtet Ziele und Wege festlegen","Spontanes Reagieren ohne vorherige Ziele","Nur das Prüfen vergangener Umsätze","Ausschließlich die Auswahl von Werbekanälen"],"a":0,"why":"Planung denkt zukünftiges Verhalten systematisch durch.","id":"m017"},{"pdf":2,"topic":"Strategisches Marketing","q":"Welche Aufgabe gehört zum strategischen Marketing?","o":["Erfolgversprechende Märkte auswählen","Jede Kundengruppe gleich behandeln","Nur tägliche Preisänderungen umsetzen","Langfristige Unternehmensziele ignorieren"],"a":0,"why":"Strategisches Marketing konzentriert sich auf attraktive Märkte und passende Marktbearbeitung.","id":"m018"},{"pdf":2,"topic":"Strategisches Marketing","q":"Welche Aussage beschreibt eine Marketingstrategie am besten?","o":["Sie zeigt grundlegende Wege zu Marketingzielen.","Sie listet nur bereits verkaufte Produkte auf.","Sie ist eine kurzfristige Einzelmaßnahme.","Sie ersetzt die Unternehmensziele."],"a":0,"why":"Strategien geben die grundlegende Richtung zur Zielerreichung vor.","id":"m019"},{"pdf":2,"topic":"Strategisches Marketing","q":"Was gehört zum Marketing-Management-Prozess?","o":["Planung, Organisation, Implementierung und Kontrolle","Beschaffung, Lagerung, Versand und Entsorgung","Vision, Werbung, Verkauf und Buchhaltung","Analyse, Preisnachlass, Reklamation und Mahnung"],"a":0,"why":"Management umfasst Planung, Organisation, Umsetzung und Kontrolle.","id":"m020"},{"pdf":3,"topic":"Marktforschung","q":"Wie beginnt und endet eine Marktforschungsuntersuchung grundsätzlich?","o":["Mit einer Datentabelle und einer Werbeanzeige","Von einem konkreten Problem bis zum Bericht mit Empfehlungen","Mit einer Stichprobe und einer Produktentwicklung","Mit einer Befragung und einer Preisänderung"],"a":1,"why":"Sie beginnt mit einer Problemdefinition und endet mit Bericht und Handlungsempfehlungen.","id":"m021"},{"pdf":3,"topic":"Marktforschung","q":"Wann ist Marktforschung für eine Entscheidung sinnvoll?","o":["Bei Unsicherheit, nutzbaren Ergebnissen und tragbaren Kosten","Wenn die Entscheidung bereits feststeht und Daten nichts ändern","Wenn Informationen immer kostenlos sind","Wenn keinerlei Informationsbedarf besteht"],"a":0,"why":"Es braucht Unsicherheit, Konsequenzbereitschaft und einen Informationswert über den Kosten.","id":"m022"},{"pdf":3,"topic":"Marktforschung","q":"Welches Ziel verfolgt Marktforschung?","o":["Bedürfnisse verstehen und Marktveränderungen früh erkennen","Alle Risiken beseitigen und Erfolge garantieren","Konkurrenzdaten sammeln, aber nicht auswerten","Marketingentscheidungen ohne Feedback treffen"],"a":0,"why":"Marktforschung hilft, Angebote auszurichten, Defizite zu erkennen und Veränderungen früh zu sehen.","id":"m023"},{"pdf":3,"topic":"Marktforschung","q":"Welche Reihenfolge ist bei einer Untersuchung plausibel?","o":["Problem, Ziele, Design, Messinstrumente, Datensammlung, Analyse, Bericht","Datensammlung, Bericht, Problem, Ziele, Design, Analyse","Design, Analyse, Problem, Bericht, Messinstrumente, Datensammlung","Ziele, Bericht, Messinstrumente, Problem, Analyse, Design"],"a":0,"why":"Erst werden Problem, Ziele und Untersuchungsplan geklärt, dann Daten erhoben und ausgewertet.","id":"m024"},{"pdf":3,"topic":"Marktforschung","q":"Was ist Primärforschung?","o":["Neue Informationen gezielt erheben","Die erneute Auswertung vorhandener Statistiken","Die Übernahme fremder Marktberichte ohne Prüfung","Die Speicherung älterer Unternehmensdaten"],"a":0,"why":"Primärforschung erhebt neue Daten, etwa durch Befragung, Beobachtung oder Experiment.","id":"m025"},{"pdf":3,"topic":"Marktforschung","q":"Was passt typischerweise zu einer qualitativen Befragung?","o":["Wenige Personen, offene Gespräche und tiefe Einblicke","Viele Personen, feste Antworten und repräsentative Zahlen","Eine Totalerhebung mit standardisierten Skalen","Ein Experiment ohne Gesprächsleitfaden"],"a":0,"why":"Qualitative Forschung arbeitet oft mit kleinen, nicht repräsentativen Stichproben und offenen Fragen.","id":"m026"},{"pdf":3,"topic":"Marktforschung","q":"Welche Grenze hat eine Online-Befragung laut Unterlagen?","o":["Sie ist wegen der Kosten meist sehr langsam.","Sie ist nicht in jedem Fall repräsentativ.","Sie erlaubt keine unterschiedlichen Fragetypen.","Sie benötigt immer einen Interviewer vor Ort."],"a":1,"why":"Online-Befragungen sind schnell und günstig, aber nicht immer repräsentativ.","id":"m027"},{"pdf":3,"topic":"Marktforschung","q":"Welcher Vorteil spricht für Beobachtung statt Befragung?","o":["Tatsächliches Verhalten kann erfasst werden.","Motive werden immer vollständig sichtbar.","Die Auswertung ist grundsätzlich kostenfrei.","Die Stichprobe ist automatisch repräsentativ."],"a":0,"why":"Beobachtung kann reales Kauf- oder Nutzungsverhalten erfassen, ohne Frageformulierungen als Einfluss.","id":"m028"},{"pdf":3,"topic":"Marktforschung","q":"Was ist ein typischer Vorteil der Sekundärforschung?","o":["Sie spart häufig Zeit und Kosten.","Sie liefert immer aktuelle Daten.","Ihre Repräsentativität ist stets kontrollierbar.","Sie passt immer exakt zur neuen Frage."],"a":0,"why":"Vorhandene Daten können schnell und günstig genutzt werden, sind aber nicht immer passend oder aktuell.","id":"m029"},{"pdf":3,"topic":"Marktforschung","q":"Welche Quelle ist unternehmensintern?","o":["Auftragseingangsstatistik","Weltbankbericht","Verbandszeitschrift","Statistisches Bundesamt"],"a":0,"why":"Auftragsdaten sind interne Unternehmensinformationen.","id":"m030"},{"pdf":3,"topic":"Marktforschung","q":"Welche Aussage über ein Experiment passt am besten?","o":["Es prüft eine Wirkung unter kontrollierten Bedingungen.","Es sammelt nur vorhandene Branchenberichte.","Es beschreibt ausschließlich Meinungen in offenen Gesprächen.","Es verzichtet auf eine gezielte Fragestellung."],"a":0,"why":"Experimente helfen, die Wirkung einer gezielten Veränderung zu untersuchen.","id":"m031"},{"pdf":3,"topic":"Marktforschung","q":"Welche Schwäche kann eine schriftliche Befragung haben?","o":["Die Rücklaufquote kann niedrig sein.","Sie verursacht immer hohe Interviewerkosten.","Sie kann keine längeren Fragebögen enthalten.","Sie ist nur mit optischen Hilfsmitteln möglich."],"a":0,"why":"Schriftliche Befragungen sind günstig, erzielen aber oft wenige Rückmeldungen.","id":"m032"},{"pdf":4,"topic":"Situationsanalyse: Umfeld, Unternehmen, Wettbewerb","q":"Wofür steht das E in PESTEL?","o":["Effizienz des Vertriebs","Economic, also wirtschaftliches Umfeld","Erfahrung der Kunden","Einkaufsverhalten im Betrieb"],"a":1,"why":"PESTEL umfasst politische, wirtschaftliche, sozio-kulturelle, technologische, ökologische und rechtliche Faktoren.","id":"m033"},{"pdf":4,"topic":"Situationsanalyse: Umfeld, Unternehmen, Wettbewerb","q":"Welcher Faktor gehört zum politischen Umfeld?","o":["Inflationsrate","Steuerregelung","Bevölkerungsalter","Logistiksystem"],"a":1,"why":"Steuerregelungen und Systemstabilität zählen zu politischen Einflussfaktoren.","id":"m034"},{"pdf":4,"topic":"Situationsanalyse: Umfeld, Unternehmen, Wettbewerb","q":"Welche Ressource gehört zur Unternehmensanalyse?","o":["Technologische Kompetenz","Wechselkurs","Kaufkraft der Bevölkerung","Neue Anbieter in der Branche"],"a":0,"why":"Technologische Ressourcen sind interne Unternehmensressourcen.","id":"m035"},{"pdf":4,"topic":"Situationsanalyse: Umfeld, Unternehmen, Wettbewerb","q":"Was ist der erste Schritt einer Ressourcenanalyse?","o":["Ein Ressourcenprofil erstellen","Sofort eine neue Strategie umsetzen","Alle Schwächen mit Werbung verdecken","Wettbewerber aus dem Markt drängen"],"a":0,"why":"Zuerst werden vorhandene Ressourcen und Fähigkeiten systematisch erfasst.","id":"m036"},{"pdf":4,"topic":"Situationsanalyse: Umfeld, Unternehmen, Wettbewerb","q":"Welche gehören bei Porter zu den primären Wertkettenaktivitäten?","o":["Logistik, Fertigung, Marketing und Kundendienst","Personalwesen, Beschaffung und Technologieentwicklung","Finanzstruktur, Personal und Beschaffung","Unternehmensführung, Personal und Forschung"],"a":0,"why":"Primäre Aktivitäten wirken direkt an Leistungserstellung und Übergabe an Kunden mit.","id":"m037"},{"pdf":4,"topic":"Situationsanalyse: Umfeld, Unternehmen, Wettbewerb","q":"Welche SWOT-Strategie nutzt eigene Stärken, um Chancen zu nutzen?","o":["SO","WO","ST","WT"],"a":0,"why":"SO-Strategien verbinden Stärken mit Chancen und bauen darauf auf.","id":"m038"},{"pdf":4,"topic":"Situationsanalyse: Umfeld, Unternehmen, Wettbewerb","q":"Welche Kraft ist Teil des 5-Kräfte-Modells nach Porter?","o":["Verhandlungsmacht der Lieferanten","Zufriedenheit der Beschäftigten","Anzahl interner Abteilungen","Stärke der eigenen Marke"],"a":0,"why":"Porter betrachtet unter anderem Lieferantenmacht, Kundenmacht, Rivalität, neue Anbieter und Ersatzprodukte.","id":"m039"},{"pdf":4,"topic":"Situationsanalyse: Umfeld, Unternehmen, Wettbewerb","q":"Was beschreibt eine strategische Gruppe?","o":["Anbieter mit ähnlicher Wettbewerbsstrategie","Alle Unternehmen mit derselben Rechtsform","Kunden mit ähnlichem Einkommen","Abteilungen mit denselben Aufgaben"],"a":0,"why":"Mitglieder derselben Gruppe verfolgen ähnliche Wettbewerbsstrategien.","id":"m040"},{"pdf":4,"topic":"Situationsanalyse: Umfeld, Unternehmen, Wettbewerb","q":"Was können Mobilitätsbarrieren bewirken?","o":["Sie erschweren einen Wechsel der strategischen Gruppe.","Sie verhindern jeden Wettbewerb innerhalb einer Branche.","Sie machen alle Strategien gleich rentabel.","Sie beseitigen die Unterschiede zwischen Unternehmen."],"a":0,"why":"Barrieren können den Eintritt in eine attraktivere strategische Gruppe erschweren.","id":"m041"},{"pdf":4,"topic":"Situationsanalyse: Umfeld, Unternehmen, Wettbewerb","q":"Wer kann ein potenzieller Wettbewerber sein?","o":["Ein branchenfremder Anbieter mit ähnlicher künftiger Zielgruppe","Nur ein derzeit größter Anbieter derselben Produktart","Jeder Zulieferer ohne eigene Kunden","Nur ein Unternehmen, das bereits Marktführer ist"],"a":0,"why":"Auch branchenfremde Anbieter können mit passenden Voraussetzungen in den Markt eintreten.","id":"m042"},{"pdf":4,"topic":"Situationsanalyse: Umfeld, Unternehmen, Wettbewerb","q":"Welche Option ist ein ökologisch-geographischer Einflussfaktor?","o":["Rohstoffverfügbarkeit und Infrastruktur","Außenpolitik und Subventionen","Bildungsniveau und Religion","Zinsniveau und Wechselkurs"],"a":0,"why":"Rohstoffe, Energie, Klima und Verkehrsanbindung gehören zu ökologisch-geographischen Faktoren.","id":"m043"},{"pdf":4,"topic":"Situationsanalyse: Umfeld, Unternehmen, Wettbewerb","q":"Welche Kombination beschreibt die SWOT-Felder richtig?","o":["Stärken und Schwächen intern, Chancen und Risiken extern","Stärken und Chancen intern, Schwächen und Risiken extern","Alle vier Felder beschreiben nur das Umfeld","Alle vier Felder beschreiben nur das Unternehmen"],"a":0,"why":"Stärken und Schwächen kommen aus dem Unternehmen, Chancen und Risiken aus dem Umfeld.","id":"m044"},{"pdf":4,"topic":"Situationsanalyse: Umfeld, Unternehmen, Wettbewerb","q":"Wodurch kann ein Wettbewerbsvorteil in Porters Wertkette entstehen?","o":["Durch Aktivitäten einzeln oder in ihrer Verknüpfung","Nur durch eine neue Werbekampagne","Nur durch die Auswahl des Absatzmarkts","Durch eine möglichst große Zahl an Abteilungen"],"a":0,"why":"Vorteile können in einzelnen Aktivitäten oder in deren Verbindung liegen.","id":"m045"},{"pdf":5,"topic":"Kundenanalyse","q":"Wann gelten Kundengruppen als ein homogenes Marktsegment?","o":["Bei ähnlichen Bedürfnissen und ähnlicher Reaktion auf Marketing","Wenn sie gleich groß sind und denselben Umsatz bringen","Wenn sie in derselben Stadt wohnen","Wenn sie dasselbe Alter und denselben Beruf haben"],"a":0,"why":"Homogene Segmente teilen ähnliche Erwartungen und reagieren ähnlich auf Marketinginstrumente.","id":"m046"},{"pdf":5,"topic":"Kundenanalyse","q":"Welche Eigenschaft ist eine Anforderung an Marktsegmente?","o":["Sie müssen messbar und erreichbar sein.","Sie müssen jedes Jahr neu entstehen.","Sie dürfen keine klare Abgrenzung haben.","Sie müssen gleich profitabel sein."],"a":0,"why":"Wichtige Anforderungen sind Messbarkeit, Erreichbarkeit, Wirtschaftlichkeit und Trennschärfe.","id":"m047"},{"pdf":5,"topic":"Kundenanalyse","q":"Was zeigt eine Nutzensegmentierung?","o":["Dass ein Produkt verschiedene Kundennutzen erfüllen kann.","Kunden kaufen nur Produkte mit gleichem Preis.","Ein Produkt kann nur ein Bedürfnis erfüllen.","Segmente unterscheiden sich ausschließlich nach Alter."],"a":0,"why":"Zahnpasta kann etwa Schutz, weißere Zähne oder frischen Geschmack bieten.","id":"m048"},{"pdf":5,"topic":"Kundenanalyse","q":"Welche Grenze haben ABC-Analysen im B2B-Geschäft?","o":["Sie zeigen vergangene Werte, aber künftiges Potenzial nur begrenzt.","Sie können keine Kunden nach Umsatz ordnen.","Sie berücksichtigen zukünftige Reaktionen besonders gut.","Sie sind nur bei Privatkunden einsetzbar."],"a":0,"why":"Vergangene Umsätze sagen nicht automatisch genug über künftiges Potenzial oder Reaktionen aus.","id":"m049"},{"pdf":5,"topic":"Kundenanalyse","q":"Warum können latente Bedürfnisse schwer zu erfragen sein?","o":["Kunden können sie oft noch nicht klar benennen.","Sie entstehen nur nach dem Kauf.","Sie hängen ausschließlich vom Preis ab.","Sie sind immer bereits an ein Produkt gebunden."],"a":0,"why":"Latente Bedürfnisse sind den Kunden oft noch nicht bewusst oder sprachlich greifbar.","id":"m050"},{"pdf":5,"topic":"Kundenanalyse","q":"Wer sind Lead User?","o":["Kunden, die Probleme früh erkennen und Lösungen entwickeln","Kunden, die immer den niedrigsten Preis wählen","Personen, die nur neue Produkte testen","Mitarbeiter, die Kaufverträge unterschreiben"],"a":0,"why":"Lead User nehmen Anwendungsprobleme früh wahr und entwickeln oft Lösungen.","id":"m051"},{"pdf":5,"topic":"Kundenanalyse","q":"Was ist ein Vorteil von Rapid Prototyping?","o":["Muster früh bauen und Fehler vorher erkennen.","Die Serienfertigung beginnt ohne Prüfung.","Kundentests werden vollständig ersetzt.","Alle Produktionskosten entfallen."],"a":0,"why":"Frühe Muster machen Schwächen sichtbar, bevor teure Produktionsschritte beginnen.","id":"m052"},{"pdf":5,"topic":"Kundenanalyse","q":"Wozu dient Predictive Maintenance im LKW-Beispiel?","o":["Wartung planen, bevor ein Ausfall droht","Fahrzeuge anhand des Kaufpreises segmentieren","Neue Modelle ohne Kundendaten planen","Reparaturen erst nach einem Stillstand erfassen"],"a":0,"why":"Sensordaten können Verschleiß anzeigen, bevor ein Ausfall auftritt.","id":"m053"},{"pdf":5,"topic":"Kundenanalyse","q":"Welche Kaufphase folgt auf die Kaufentscheidung im gezeigten Modell?","o":["Kaufabsicht und Einkaufsverhalten","Entstehung des Bedarfs","Nachkaufverhalten","Entsorgung und Recycling"],"a":0,"why":"Die vier Phasen sind Bedarf, Kaufentscheidung, Kaufabsicht/Einkauf und Nachkaufverhalten.","id":"m054"},{"pdf":5,"topic":"Kundenanalyse","q":"Welche Kaufentscheidung hat meist den höchsten Informationsbedarf?","o":["Extensive Entscheidung","Limitierte Entscheidung","Habitualisierte Entscheidung","Impulskauf"],"a":0,"why":"Extensive Entscheidungen sind neu und wichtig; deshalb wird besonders viel Information gesucht.","id":"m055"},{"pdf":5,"topic":"Kundenanalyse","q":"Wer ist im Buying Center typischerweise Gatekeeper?","o":["Eine Person, die Informationen auswählt oder weiterleitet","Die Person, die das Produkt täglich nutzt","Die Person mit formaler Einkaufsbefugnis","Die Person, die das Budget endgültig freigibt"],"a":0,"why":"Gatekeeper steuern den Informationsfluss zu Entscheidungsträgern.","id":"m056"},{"pdf":5,"topic":"Kundenanalyse","q":"Was beschreibt die kognitive Komponente einer Einstellung?","o":["Die rationale Beurteilung und das Denken","Das Gefühl gegenüber einem Angebot","Die Absicht, ein Angebot zu kaufen","Die tatsächliche Nutzung nach dem Kauf"],"a":0,"why":"Kognitiv bezieht sich auf Denken und Beurteilung, affektiv auf Fühlen, konativ auf Handlungsabsicht.","id":"m057"},{"pdf":5,"topic":"Kundenanalyse","q":"Wer ist im Buying Center der formale Einkäufer?","o":["Die Person oder Abteilung mit Einkaufsbefugnis","Die Person mit dem höchsten Produktwissen","Die Person, die Anwenderfragen beantwortet","Die Person, die Informationszugang filtert"],"a":0,"why":"Der Einkäufer hat formale Kompetenz im Beschaffungsprozess.","id":"m058"},{"pdf":5,"topic":"Kundenanalyse","q":"Was tun Promotoren im Beschaffungsprozess?","o":["Sie treiben ihn aktiv voran.","Sie verzögern ihn gezielt.","Sie wählen nur die Werbebotschaft.","Sie ersetzen die Lieferantensuche."],"a":0,"why":"Promotoren fördern den Beschaffungsprozess; Opponenten behindern oder verzögern ihn.","id":"m059"},{"pdf":6,"topic":"Zielplanung","q":"Worauf basieren Ziele laut Definition?","o":["Auf der Situationsanalyse","Auf der letzten Werbekampagne","Auf Vermutungen über Wettbewerber","Auf dem persönlichen Geschmack der Leitung"],"a":0,"why":"Die Situationsanalyse liefert die Grundlage für Entscheidungen und Ziele.","id":"m060"},{"pdf":6,"topic":"Zielplanung","q":"Was beschreibt eine Vision?","o":["Einen angestrebten zukünftigen Zustand","Eine konkrete Wochenaufgabe","Eine Aufstellung der Kostenstellen","Ein aktuelles Kundenurteil"],"a":0,"why":"Die Vision beschreibt ein gewünschtes Zukunftsbild und gibt Orientierung.","id":"m061"},{"pdf":6,"topic":"Zielplanung","q":"Wie unterscheidet sich die Mission meist von der Vision?","o":["Sie beschreibt den Unternehmenszweck konkreter.","Sie enthält nur Finanzkennzahlen.","Sie gilt nur für einzelne Werbemaßnahmen.","Sie beschreibt ausschließlich die Vergangenheit."],"a":0,"why":"Die Mission orientiert sich an der Vision und formuliert den Zweck konkreter.","id":"m062"},{"pdf":6,"topic":"Zielplanung","q":"Was gehört zu einem ökonomischen Ziel?","o":["Steigerung des Deckungsbeitrags","Erhöhung der Bekanntheit","Verbesserung des Images","Stärkere Kundenbindung"],"a":0,"why":"Deckungsbeitrag, Gewinn, Umsatz und Marktanteil sind ökonomische Größen.","id":"m063"},{"pdf":6,"topic":"Zielplanung","q":"Was gehört zu einem außerökonomischen Ziel?","o":["Kundenzufriedenheit","Umsatz","Gewinn","Rentabilität"],"a":0,"why":"Einstellung, Image, Bekanntheit, Zufriedenheit und Bindung sind außerökonomisch.","id":"m064"},{"pdf":6,"topic":"Zielplanung","q":"Was ist ein operatives Marketingziel?","o":["Ein konkretes Ziel für ein Marketinginstrument","Eine Vision für das gesamte Unternehmen","Eine allgemeine Aussage ohne Termin oder Messung","Eine Wettbewerbsanalyse ohne Zielwert"],"a":0,"why":"Operative Ziele setzen strategische Marketingziele über konkrete Instrumente um.","id":"m065"},{"pdf":6,"topic":"Zielplanung","q":"Welches SMART-Merkmal verlangt einen klaren Endtermin?","o":["Terminiert","Messbar","Spezifisch","Akzeptiert"],"a":0,"why":"T steht in dieser Fassung für terminiert.","id":"m066"},{"pdf":6,"topic":"Zielplanung","q":"Welche vier Angaben helfen, ein Ziel zu operationalisieren?","o":["Inhalt, Ausmaß, Zeitbezug und Segmentbezug","Preis, Produkt, Ort und Werbung","Vision, Mission, Werte und Kultur","Kosten, Personal, Technik und Recht"],"a":0,"why":"Ziele werden nach Was, wie viel, bis wann und bei wem konkretisiert.","id":"m067"},{"pdf":6,"topic":"Zielplanung","q":"Wie hängen nichtökonomische und ökonomische Ziele im Marketing-Funnel zusammen?","o":["Positive Einstellung kann Kauf und Umsatz vorbereiten.","Ökonomische Ziele müssen immer zuerst erreicht sein.","Beide Zielarten haben keinen möglichen Zusammenhang.","Nichtökonomische Ziele ersetzen jeden Umsatz."],"a":0,"why":"Bekanntheit, Vertrautheit und Auswahl bilden oft Voraussetzungen für Kauf und Umsatz.","id":"m068"},{"pdf":6,"topic":"Zielplanung","q":"Was kennzeichnet eine konfligierende Zielbeziehung?","o":["Ein Ziel zu erreichen erschwert ein anderes Ziel.","Ziele beeinflussen einander gar nicht.","Ein Zielerfolg unterstützt immer das andere Ziel.","Beide Ziele werden gleichzeitig aufgegeben."],"a":0,"why":"Konfligierende Ziele haben eine negative Wirkung aufeinander.","id":"m069"},{"pdf":6,"topic":"Zielplanung","q":"Was ist der Schwerpunkt der Aktionsplanung?","o":["Geeignete Mittel und Wege zur Zielerreichung festlegen","Den gewünschten Zustand ohne Maßnahmen beschreiben","Die Mission und Vision des Unternehmens neu schreiben","Nur den Erfolg einer alten Strategie messen"],"a":0,"why":"Aktionsplanung entscheidet, wie gesetzte Ziele mit konkreten Mitteln erreicht werden.","id":"m070"},{"pdf":6,"topic":"Zielplanung","q":"Welche Zielbeziehung ist komplementär?","o":["Ein Ziel zu erreichen fördert ein anderes Ziel.","Ein Ziel behindert die Erreichung eines anderen.","Zwei Ziele haben keinerlei Zusammenhang.","Zwei Ziele schließen einander immer aus."],"a":0,"why":"Komplementäre Ziele unterstützen einander, etwa besserer Service und höhere Zufriedenheit.","id":"m071"},{"pdf":6,"topic":"Zielplanung","q":"Wozu dient die Zielhierarchie?","o":["Sie ordnet Unternehmensziele bis zu Instrumentzielen.","Sie sortiert Kunden nach Umsatz.","Sie beschreibt nur die Abfolge eines Kaufprozesses.","Sie ersetzt die Strategieentwicklung."],"a":0,"why":"Operative Marketingziele leiten sich über mehrere Ebenen von übergeordneten Zielen ab.","id":"m072"},{"pdf":7,"topic":"Strategieentwicklung","q":"Welche Frage gehört zur Corporate-Ebene?","o":["In welchen Geschäftsfeldern wollen wir aktiv sein?","Wie setzt die Werbung die Kampagne um?","Welche Lieferanten liefern nächste Woche?","Wie wird die tägliche Produktion geplant?"],"a":0,"why":"Corporate Strategy bestimmt, in welchen Geschäftsfeldern das Unternehmen tätig ist.","id":"m073"},{"pdf":7,"topic":"Strategieentwicklung","q":"Welche Frage gehört zur Business-Ebene?","o":["Wie erlangt dieses Geschäftsfeld einen Wettbewerbsvorteil?","Welche Aufgabe hat jede einzelne Abteilung heute?","Welche Kundenanfrage wird zuerst beantwortet?","Wie wird ein einzelner Newsletter gestaltet?"],"a":0,"why":"Business Strategy sucht den Wettbewerbsvorteil eines Geschäftsfelds.","id":"m074"},{"pdf":7,"topic":"Strategieentwicklung","q":"Was bedeutet Marktdurchdringung in der Ansoff-Matrix?","o":["Bestehende Produkte im vorhandenen Markt stärker verkaufen","Neue Produkte in neuen Märkten anbieten","Neue Produkte in bestehenden Märkten entwickeln","Bestehende Produkte in neuen Märkten einführen"],"a":0,"why":"Marktdurchdringung verbindet bestehende Produkte mit bestehenden Märkten.","id":"m075"},{"pdf":7,"topic":"Strategieentwicklung","q":"Welche Ansoff-Strategie erschließt neue Märkte mit bestehenden Produkten?","o":["Marktentwicklung","Produktentwicklung","Marktdurchdringung","Diversifikation"],"a":0,"why":"Marktentwicklung sucht neue Märkte, etwa durch Internationalisierung oder neue Segmente.","id":"m076"},{"pdf":7,"topic":"Strategieentwicklung","q":"Was ist ein Beispiel für vertikale Diversifikation?","o":["Ein Autobauer stellt selbst Reifen her.","Ein Möbelhaus verkauft zusätzlich Kissen.","Ein Lebensmittelhersteller verkauft ein völlig fremdes Produkt.","Ein bestehendes Produkt erhält eine neue Farbe."],"a":0,"why":"Vertikale Diversifikation erweitert vor- oder nachgelagerte Stufen der Wertschöpfung.","id":"m077"},{"pdf":7,"topic":"Strategieentwicklung","q":"Worauf zielt Kostenführerschaft vor allem?","o":["Eine möglichst niedrige Kostenposition im Markt","Ein exklusives Design in einer kleinen Zielgruppe","Die größte Produktvielfalt ohne Kostenziel","Ein emotionales Markenbild ohne Preisvorteil"],"a":0,"why":"Kostenführerschaft setzt auf niedrige Kosten und kann dadurch günstige Preise ermöglichen.","id":"m078"},{"pdf":7,"topic":"Strategieentwicklung","q":"Welches Risiko kann Qualitätsführerschaft mit sich bringen?","o":["Kunden honorieren den zusätzlichen Nutzen nicht.","Der Marktanteil wächst automatisch zu stark.","Die Zielgruppe wird immer stabiler.","Die Kosten sinken schneller als geplant."],"a":0,"why":"Kunden können den Mehrwert übersehen oder nicht bereit sein, dafür mehr zu zahlen.","id":"m079"},{"pdf":7,"topic":"Strategieentwicklung","q":"Was ist eine Voraussetzung für eine tragfähige Positionierung?","o":["Sie ist für die Zielgruppe relevant und klar unterscheidbar.","Sie spricht möglichst alle Kunden gleich an.","Sie ändert sich mit jeder Werbekampagne.","Sie folgt ausschließlich den Vorstellungen des Unternehmens."],"a":0,"why":"Positionierung soll Kompetenz, Zielgruppenrelevanz und klare Differenzierung verbinden.","id":"m080"},{"pdf":7,"topic":"Strategieentwicklung","q":"Was meint der Grundnutzen eines Angebots?","o":["Den technischen oder funktionalen Nutzen","Den Status, den eine Marke vermittelt","Das Gefühl einer Werbekampagne","Die Beziehung zum Vertriebsteam"],"a":0,"why":"Grundnutzen meint den technischen oder funktionalen Nutzen; Zusatznutzen kann emotional sein.","id":"m081"},{"pdf":7,"topic":"Strategieentwicklung","q":"Was bedeutet eine offensive Wettbewerbsstrategie?","o":["Wettbewerber angreifen, um Marktanteile zu gewinnen","Die Marktposition halten und direkte Konfrontation meiden","Spielregeln des Wettbewerbs unverändert lassen","Sich ganz aus dem Wettbewerb zurückziehen"],"a":0,"why":"Offensiv bedeutet, Wettbewerber anzugreifen und Marktanteile zu gewinnen.","id":"m082"},{"pdf":7,"topic":"Strategieentwicklung","q":"Was kennzeichnet eine Nischenstrategie?","o":["Ein attraktives Segment gezielt bedienen","Alle Segmente mit demselben Angebot bedienen","Der Preis ist stets das einzige Kaufkriterium","Die Zielgruppe möglichst häufig wechseln"],"a":0,"why":"Nischenanbieter fokussieren ein attraktives Segment und bauen spezielles Zielgruppenwissen auf.","id":"m083"},{"pdf":7,"topic":"Strategieentwicklung","q":"Was ist ein Risiko der Positionierung in der Marktmitte?","o":["Viele ähnliche Angebote erschweren die Orientierung.","Alle Kunden wechseln automatisch zur Premium-Marke.","Die Zielgruppe wird zu genau abgegrenzt.","Es gibt zu wenige Wettbewerber für Vergleiche."],"a":0,"why":"Viele ähnliche Angebote in der Mitte können Verwirrung und Bedeutungsverlust schaffen.","id":"m084"},{"pdf":7,"topic":"Strategieentwicklung","q":"Was bedeutet eine defensive Wettbewerbsstrategie?","o":["Marktposition halten und Konfrontation meiden","Angreifer mit Preissenkungen stets überbieten","Die Spielregeln der Branche neu erfinden","Die Zielgruppe auf Wettbewerber übertragen"],"a":0,"why":"Defensiv bedeutet, die eigene Position zu verteidigen und direkte Konfrontationen zu meiden.","id":"m085"},{"pdf":7,"topic":"Strategieentwicklung","q":"Welche drei Fragen strukturieren Marketingstrategien?","o":["Wer sind unsere Kunden, wie profilieren wir uns, wie verhalten wir uns im Wettbewerb?","Wie hoch ist unser Umsatz, wie viele Mitarbeiter haben wir, wo ist unser Lager?","Welches Produkt verkaufen wir, wie wird es gefertigt, wann wird es verschickt?","Welche Kosten senken wir, wen stellen wir ein, wie groß ist der Markt?"],"a":0,"why":"Die drei Teilstrategien betreffen Segmentierung, Positionierung und Wettbewerbsverhalten.","id":"m086"}];
const PDF_NAMES={1:'Grundgedanken des Marketing',2:'Strategisches Marketing',3:'Methoden der empirischen Sozialforschung',4:'Umfeld, Unternehmen und Wettbewerb',5:'Analyse der Kunden',6:'Zielplanung',7:'Strategieentwicklung'};
const TERMS=[["4 Ps","Die 4 Ps sind Product (Produkt), Price (Preis), Place (Verkaufsort) und Promotion (Werbung). Sie bilden den Marketing-Mix.","Beispiel: Bei Zahnpasta gehören Sorte, Preis, Laden und Werbung zu den 4 Ps."],["5 Kräfte nach Porter","Das Modell zeigt fünf Kräfte, die den Wettbewerb in einer Branche beeinflussen.","Beispiel: Viele Ersatzprodukte geben Kunden mehr Auswahl und erhöhen den Preisdruck."],["7 Ps","Die 7 Ps sind die 4 Ps plus People (Personal), Physical Facilities (Ausstattung) und Process (Ablauf). Sie helfen beim Marketing von Dienstleistungen.","Beispiel: Im Hotel zählen neben Preis und Werbung auch Mitarbeitende, Zimmer und Check-in."],["ABC-Analyse","Die ABC-Analyse teilt Kunden nach ihrem bisherigen Umsatz in A-, B- und C-Kunden ein.","Beispiel: A-Kunden kaufen viel, C-Kunden wenig."],["AIDA","AIDA erklärt vier Schritte der Werbewirkung: Attention (Aufmerksamkeit), Interest (Interesse), Desire (Wunsch), Action (Handlung).","Beispiel: Eine Anzeige fällt auf, macht neugierig, zeigt einen Vorteil und lädt zum Kauf ein."],["Ansoff-Matrix","Die Ansoff-Matrix ist eine Tabelle, mit der Firmen vier Wege zum Wachstum auswählen.","Beispiel: Ein neuer Markt für ein bestehendes Produkt heißt Marktentwicklung."],["Buying Center","Das Buying Center ist die Gruppe von Personen, die in einer Firma einen Kauf vorbereitet oder entscheidet.","Beispiel: Nutzer testen die Maschine, Einkauf vergleicht Preise, die Leitung genehmigt den Kauf."],["Customer Insight","Ein Customer Insight ist eine Erkenntnis darüber, was Kunden wirklich brauchen oder warum sie kaufen.","Beispiel: Kunden wollen keinen Bohrer an sich, sondern schnell ein Bild aufhängen."],["Differenzierung","Differenzierung bedeutet, ein Angebot durch einen besonderen Vorteil von anderen Angeboten abzuheben.","Beispiel: Ein Werkzeug ist leichter als die Konkurrenzprodukte."],["Diversifikation","Diversifikation bedeutet: ein neues Produkt für einen neuen Markt anbieten.","Beispiel: Eine Werkzeugfirma steigt in einen ganz neuen Geschäftsbereich ein."],["Gatekeeper","Ein Gatekeeper filtert Informationen, bevor sie die Entscheider erreichen.","Beispiel: Eine Assistenz wählt aus, welche Angebote die Geschäftsleitung sieht."],["Grundnutzen","Der Grundnutzen ist die wichtigste praktische Funktion eines Produkts.","Beispiel: Ein Bohrer macht Löcher."],["KKV","KKV heißt komparativer Konkurrenzvorteil. Es ist ein Vorteil, der Kunden wichtiger ist als das Angebot der Konkurrenz.","Beispiel: Ein Betrieb kauft die Maschine, weil sie schneller arbeitet."],["Kostenführerschaft","Kostenführerschaft bedeutet, günstiger herzustellen als die Konkurrenz.","Beispiel: Große Stückzahlen senken die Kosten pro Werkzeug."],["Lead User","Lead User sind Kunden, die Probleme früh bemerken und oft selbst Lösungen entwickeln.","Beispiel: Ein Handwerker baut einen besseren Halter für sein Werkzeug."],["Marktdurchdringung","Marktdurchdringung bedeutet, ein bestehendes Produkt im bisherigen Markt öfter zu verkaufen.","Beispiel: Mehr Menschen in Berlin kaufen denselben Akkuschrauber."],["Marktentwicklung","Marktentwicklung bedeutet, ein bestehendes Produkt in einem neuen Markt zu verkaufen.","Beispiel: Eine Firma verkauft ihren Schrauber erstmals in Frankreich."],["Marktforschung","Marktforschung ist das gezielte Sammeln von Informationen über Kunden und Märkte.","Beispiel: Eine Firma fragt Käufer, was ihnen an einer neuen Verpackung wichtig ist."],["Marktsegmentierung","Marktsegmentierung bedeutet, Kunden mit ähnlichen Bedürfnissen zu Gruppen zusammenzufassen.","Beispiel: Profis und Heimwerker bekommen unterschiedliche Werkzeuge angeboten."],["Mission","Die Mission sagt, was eine Firma tut und für wen.","Beispiel: Eine Firma baut Solaranlagen für Haushalte."],["Nischenstrategie","Bei einer Nischenstrategie konzentriert sich eine Firma auf eine bestimmte Kundengruppe.","Beispiel: Ein Hersteller baut Werkzeuge nur für Dachdecker."],["PESTEL","PESTEL ordnet äußere Einflüsse in sechs Bereiche: Political (Politik), Economic (Wirtschaft), Social (Gesellschaft), Technological (Technik), Environmental (Umwelt), Legal (Recht).","Beispiel: Eine neue Umweltregel kann die Herstellung eines Produkts verändern."],["Positionierung","Positionierung bedeutet, festzulegen, wofür eine Marke im Kopf der Kunden stehen soll.","Beispiel: Bei einer Marke denken Kunden zuerst an besonders leichte Werkzeuge."],["Primärforschung","Primärforschung bedeutet, neue Informationen direkt für eine eigene Frage zu sammeln.","Beispiel: Eine Firma befragt ihre Kundinnen zum Gewicht eines Werkzeugs."],["Produktentwicklung","Produktentwicklung bedeutet, ein neues oder verbessertes Produkt für bisherige Märkte anzubieten.","Beispiel: Eine Firma bringt für ihre bisherigen Kunden einen stärkeren Akku heraus."],["Qualitative Forschung","Qualitative Forschung nutzt ausführliche Gespräche, um Gründe und Meinungen zu verstehen.","Beispiel: Ein Gespräch klärt, warum Kunden eine Maschine schwer zu bedienen finden."],["Quantitative Forschung","Quantitative Forschung zählt Antworten von vielen Personen auf dieselben Fragen.","Beispiel: 62 von 100 Befragten wünschen sich ein leichteres Werkzeug."],["Sekundärforschung","Sekundärforschung bedeutet, bereits vorhandene Informationen für eine Frage zu nutzen.","Beispiel: Eine Firma wertet alte Verkaufszahlen aus."],["SMART-Ziel","Ein SMART-Ziel ist Specific (klar), Measurable (messbar), Accepted (abgestimmt), Realistic (machbar) und Timed (befristet).","Beispiel: Bis Juni sollen 80 Prozent der Zielgruppe die Marke kennen."],["Strategische Gruppe","Eine strategische Gruppe besteht aus Firmen, die in einer Branche ähnlich konkurrieren.","Beispiel: Mehrere Marken verkaufen einfache Werkzeuge zu niedrigen Preisen."],["SWOT","SWOT steht für Strengths, Weaknesses, Opportunities, Threats: Stärken, Schwächen, Chancen und Risiken.","Beispiel: Gute Technik ist eine Stärke. Eine neue Vorschrift kann ein Risiko sein."],["USP","USP heißt Unique Selling Proposition. Das ist das besondere Versprechen eines Angebots.","Beispiel: Unser Akku hält länger als andere Akkus."],["Vision","Die Vision beschreibt, was eine Firma in Zukunft erreichen möchte.","Beispiel: Jede Familie soll saubere Energie nutzen können."],["Wertkette","Die Wertkette umfasst die Schritte, mit denen eine Firma ein Produkt herstellt und zum Kunden bringt.","Beispiel: Material einkaufen, Werkzeug bauen, verkaufen und Service anbieten."],["Zusatznutzen","Der Zusatznutzen ist ein weiterer Vorteil oder ein Gefühl neben der Hauptfunktion.","Beispiel: Eine teure Uhr zeigt die Zeit und vermittelt zugleich Status."],["Ökonomische und außerökonomische Ziele","Ökonomische Ziele betreffen Geld oder Marktanteile. Außerökonomische Ziele betreffen zum Beispiel Bekanntheit oder Zufriedenheit.","Beispiel: Mehr Umsatz ist ökonomisch. Mehr Vertrauen in die Marke ist außerökonomisch."]];
const state={pdf:1,index:0,answers:{},terms:false};
function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffled(items){const result=items.slice();for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}return result}
function answerState(q){if(!state.answers[q.id])state.answers[q.id]={options:shuffled(q.o.map((text,original)=>({text,correct:original===q.a}))),selected:null};return state.answers[q.id]}
function questionsForPdf(){return QUESTIONS.filter(q=>q.pdf===state.pdf)}
function renderPdfTabs(){const labels={1:'1 · Grundlagen',2:'2 · Strategie',3:'3 · Forschung',4:'4 · Umfeld',5:'5 · Kunden',6:'6 · Ziele',7:'7 · Entwicklung'};return `<nav class="pdf-tabs" aria-label="PDF auswählen">${Object.keys(PDF_NAMES).map(number=>`<button class="pdf-tab${state.pdf===Number(number)?' active':''}" data-action="pdf" data-pdf="${number}" aria-pressed="${state.pdf===Number(number)}">${labels[number]}</button>`).join('')}</nav>`}
function renderQuestionTabs(){const qs=questionsForPdf();return `<nav class="question-tabs" aria-label="Frage auswählen">${qs.map(q=>{const saved=answerState(q),number=qs.indexOf(q)+1,correct=saved.selected!==null&&saved.options[saved.selected].correct;const status=saved.selected===null?'':correct?' correct':' wrong';return `<button class="question-tab${status}${q.id===QUESTIONS[state.index]?.id?' active':''}" data-action="jump" data-id="${q.id}" aria-label="Frage ${number}${saved.selected===null?'':correct?', richtig beantwortet':', falsch beantwortet'}"${q.id===QUESTIONS[state.index]?.id?' aria-current="step"':''}>${number}</button>`}).join('')}</nav>`}
function renderTerms(){return `<section class="terms-screen" role="dialog" aria-modal="true" aria-labelledby="terms-title"><div class="terms-shell"><header class="terms-head"><button class="back" data-action="close-terms">Zurück</button><h1 id="terms-title">Fachbegriffe</h1></header><p class="terms-intro">Wichtige Begriffe aus dem Marketing. Zu jedem Begriff gibt es eine kurze Erklärung und ein Beispiel.</p><div class="term-list">${TERMS.map(([name,meaning,example])=>`<article class="term"><h3>${esc(name)}</h3><p>${esc(meaning)}</p><p><strong>Beispiel:</strong> ${esc(example)}</p></article>`).join('')}</div></div></section>`}
function renderQuestion(){const q=QUESTIONS[state.index];if(!q)return `<section class="finish"><p class="meta">PDF 7 abgeschlossen</p><h1>Alle Fragen sind durch.</h1><button class="nav-button" data-action="restart">Von vorne</button></section>`;const qs=questionsForPdf(),within=qs.findIndex(item=>item.id===q.id)+1,saved=answerState(q),correct=saved.options.findIndex(option=>option.correct),answered=saved.selected!==null;return `<section class="question"><p class="meta">PDF ${q.pdf} · ${esc(PDF_NAMES[q.pdf])}<br>Frage ${within} von ${qs.length}</p><h1>${esc(q.q)}</h1><div class="answers">${saved.options.map((option,index)=>{const cls=answered?(option.correct?' correct':index===saved.selected?' wrong':''):'';return `<button class="answer${cls}" data-action="answer" data-index="${index}" ${answered?'disabled':''}><span class="letter">${'ABCD'[index]}</span><span>${esc(option.text)}</span></button>`}).join('')}</div>${answered?`<div class="feedback ${saved.options[saved.selected].correct?'correct':'wrong'}" role="status"><strong>${saved.options[saved.selected].correct?'Richtig.':`Falsch. Richtig ist ${'ABCD'[correct]}. ${esc(saved.options[correct].text)}`}</strong><p>${esc(q.why)}</p></div>`:''}<div class="nav"><button class="nav-button" data-action="previous" ${state.index===0?'disabled':''}>Zurück</button><button class="nav-button" data-action="next" ${!answered||state.index===QUESTIONS.length-1?'disabled':''}>Weiter</button></div></section>`}
function render(){const pageTop=window.scrollY,pdfLeft=document.querySelector('.pdf-tabs')?.scrollLeft||0,questionLeft=document.querySelector('.question-tabs')?.scrollLeft||0;const current=QUESTIONS[state.index];if(current)state.pdf=current.pdf;document.getElementById('app').innerHTML=`<main class="app"><header class="header"><div class="brand">Marketing lernen</div><button class="terms-open" data-action="open-terms">Fachbegriffe</button></header>${renderPdfTabs()}${current?renderQuestionTabs():''}${renderQuestion()}</main>${state.terms?renderTerms():''}`;const pdfTabs=document.querySelector('.app > .pdf-tabs');const questionTabs=document.querySelector('.app > .question-tabs');if(pdfTabs)pdfTabs.scrollLeft=pdfLeft;if(questionTabs)questionTabs.scrollLeft=questionLeft;window.scrollTo(0,pageTop)}
document.getElementById('app').addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;if(action==='open-terms'){state.terms=true;render()}else if(action==='close-terms'){state.terms=false;render()}if(action==='pdf'){state.pdf=Number(button.dataset.pdf);state.index=QUESTIONS.findIndex(q=>q.pdf===state.pdf);render()}else if(action==='jump'){state.index=QUESTIONS.findIndex(q=>q.id===button.dataset.id);render()}else if(action==='answer'){const q=QUESTIONS[state.index],saved=answerState(q);if(saved.selected===null){saved.selected=Number(button.dataset.index);render()}}else if(action==='previous'&&state.index>0){state.index--;render()}else if(action==='next'&&state.index<QUESTIONS.length-1&&answerState(QUESTIONS[state.index]).selected!==null){state.index++;render()}else if(action==='restart'){state.answers={};state.index=0;state.pdf=1;render()}});
render();
</script>
</body>
</html>

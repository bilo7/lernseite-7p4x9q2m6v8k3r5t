ings\u003c/li>\n\u003cli>endloses Scrollen auf Social Media\u003c/li>\n\u003cli>Unterbrechungen\u003c/li>\n\u003cli>zielloses YouTube schauen\u003c/li>\n\u003cli>Prokrastination\u003c/li>\n\u003cli>unnötiges Surfen im Internet\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>Gantt-Chart\u003c/summary>\u003cdiv>\u003cp>Balkendiagramm, das zeigt:\u003c/p>\n\u003cul>\n\u003cli>welche Aufgaben erledigt werden\u003c/li>\n\u003cli>wann sie beginnen\u003c/li>\n\u003cli>wann sie enden\u003c/li>\n\u003cli>wie lange sie dauern\u003c/li>\n\u003c/ul>\n\u003cp>Zeigt auch:\u003c/p>\n\u003cul>\n\u003cli>Reihenfolge\u003c/li>\n\u003cli>Abhängigkeiten zwischen Aufgaben\u003c/li>\n\u003c/ul>\n\u003ch3>Wann eignet sich welche Methode?\u003c/h3>\n\u003ch4>GTD\u003c/h4>\n\u003cp>Alltag mit vielen kleinen Aufgaben ohne feste Zeitstruktur.\u003c/p>\n\u003cp>\u003cstrong>Ebene:\u003c/strong> Makro\u003c/p>\n\u003cul>\n\u003cli>Priorisieren\u003c/li>\n\u003cli>wenn viele Aufgaben gleichzeitig anfallen\u003c/li>\n\u003c/ul>\n\u003ch4>Pomodoro\u003c/h4>\n\u003cp>Einzelne Arbeitsphasen mit Fokusproblemen.\u003c/p>\n\u003cp>\u003cstrong>Ebene:\u003c/strong> Mikro\u003c/p>\n\u003cul>\n\u003cli>Projekte mit mehreren Phasen\u003c/li>\n\u003cli>festen Deadlines\u003c/li>\n\u003cli>Abhängigkeiten\u003c/li>\n\u003c/ul>\n\u003ch4>Gantt-Chart\u003c/h4>\n\u003cp>Projekte mit mehreren Phasen, festen Deadlines und Abhängigkeiten.\u003c/p>\n\u003cp>\u003cstrong>Faustregel:\u003c/strong>\u003c/p>\n\u003cp>Gantt lohnt sich ab mehr als zwei Wochen Laufzeit mit mindestens drei Arbeitspaketen.\u003c/p>\n\u003ch3>Was ein Gantt-Chart nicht kann\u003c/h3>\n\u003cul>\n\u003cli>Scheingenauigkeit: Ein detaillierter Plan suggeriert Kontrolle, die oft nicht existiert.\u003c/li>\n\u003cli>Kurzfristig flexible Projekte verlieren ihren Nutzen.\u003c/li>\n\u003cli>Iterationen und Sprintzeiten einfach schwer darstellbar.\u003c/li>\n\u003cli>Wartungsaufwand: Wer den Plan nicht aktuell hält, verliert schnell den Überblick.\u003c/li>\n\u003cli>Agile Kritik: In der Softwareentwicklung eher hinderlich, weil Fokus von Scrum und Kanban auf Ergebnissen liegt.\u003c/li>\n\u003c/ul>\n\u003cp>→ Empfehlung für studentische Projekte mehr auf eine wöchentliche Version mit wenigen Arbeitspaketen.\u003c/p>\n\u003c/div>\u003c/details>","9":"\u003cdetails class=\"note-section\">\u003csummary>MBSR\u003c/summary>\u003cdiv>\u003ch3>Was ist MBSR?\u003c/h3>\n\u003cul>\n\u003cli>\n\u003cp>\u003cstrong>Mindfulness-Based Stress Reduction\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>entwickelt von Jon Kabat-Zinn, Universität Massachusetts, 1979\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Strukturiertes 8-Wochen-Gruppentraining\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>ca. 2,5 h/Woche + tägliche Heimpraxis\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Ursprünglich für chronisch kranke Patienten\u003c/strong>, heute breit eingesetzt\u003c/p>\n\u003cul>\n\u003cli>Arbeitswelt\u003c/li>\n\u003cli>Schule\u003c/li>\n\u003cli>Klinik\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\n\u003cp>Kein religiöser Kontext:\u003c/p>\n\u003cul>\n\u003cli>vollständig säkularisiert\u003c/li>\n\u003cli>evidenzbasiert\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\n\u003cp>Kombination aus:\u003c/p>\n\u003cul>\n\u003cli>formaler Meditationspraxis\u003c/li>\n\u003cli>achtsamen Alltagsübungen\u003c/li>\n\u003cli>Psychoedukation\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>Trainingsziele nach Kirkpatrick\u003c/summary>\u003cdiv>\u003cp>\u003cstrong>Wie wird der Trainingserfolg bewertet?\u003c/strong>\u003c/p>\n\u003ch3>Ebene 1: Hat es gefallen?\u003c/h3>\n\u003ch3>Ebene 2: Wurde etwas gelernt?\u003c/h3>\n\u003ch3>Ebene 3: Wird das Gelernte angewendet?\u003c/h3>\n\u003ch3>Ebene 4: Hat das Unternehmen einen Nutzen?\u003c/h3>\n\u003chr />\n\u003ch3>1. Reaktion\u003c/h3>\n\u003cp>Wie zufrieden waren die Teilnehmenden mit dem Training?\u003c/p>\n\u003cp>Bsp.:\u003c/p>\n\u003cul>\n\u003cli>Zufriedenheitsfragebogen direkt nach dem Training\u003c/li>\n\u003c/ul>\n\u003ch3>2. Lernen\u003c/h3>\n\u003cp>Was haben die Teilnehmenden gelernt?\u003c/p>\n\u003cp>Haben sich Wissen oder Fähigkeiten verbessert?\u003c/p>\n\u003cp>Bsp.:\u003c/p>\n\u003cul>\n\u003cli>Wissenstest vor und nach dem Training\u003c/li>\n\u003cli>Kompetenzmessung\u003c/li>\n\u003c/ul>\n\u003ch3>3. Verhalten\u003c/h3>\n\u003cp>Wird das Gelernte im Arbeitsalltag tatsächlich angewendet?\u003c/p>\n\u003cp>Bsp.:\u003c/p>\n\u003cul>\n\u003cli>Befragung nach 4-8 Wochen\u003c/li>\n\u003cli>Fremdeinschätzung durch Vorgesetzte oder Kollegen\u003c/li>\n\u003c/ul>\n\u003ch3>4. Ergebnisse\u003c/h3>\n\u003cp>Welche Auswirkungen hat Training auf Organisation?\u003c/p>\n\u003cp>Bsp.:\u003c/p>\n\u003cul>\n\u003cli>weniger Krankheitstage\u003c/li>\n\u003cli>geringere Burnout-Raten\u003c/li>\n\u003cli>höhere Produktivität\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>Trainingsziele formulieren nach Kraiger\u003c/summary>\u003cdiv>\u003cp>\u003cstrong>Was wird gelernt?\u003c/strong>\u003c/p>\n\u003cp>Erweitert Kirkpatrick-Modell, indem es darauf konzentriert, \u003cstrong>was genau gelernt wird\u003c/strong>.\u003c/p>\n\u003cp>3 Lernbereiche.\u003c/p>\n\u003ch3>1) Affektiv\u003c/h3>\n\u003cp>\u003cstrong>Was wird verändert?\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Einstellungen\u003c/li>\n\u003cli>Motivation\u003c/li>\n\u003cli>Selbstvertrauen\u003c/li>\n\u003cli>Werte\u003c/li>\n\u003c/ul>\n\u003cp>Bsp.:\u003c/p>\n\u003cp>Teilnehmende entwickeln positive Einstellung zur Teamarbeit oder mehr Selbstvertrauen im Umgang mit Konflikten.\u003c/p>\n\u003ch3>2) Kognitiv\u003c/h3>\n\u003cp>\u003cstrong>Was wird verändert?\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Wissen\u003c/li>\n\u003cli>Verständnis\u003c/li>\n\u003cli>Problemlösefähigkeit\u003c/li>\n\u003c/ul>\n\u003cp>Bsp.:\u003c/p>\n\u003cp>Teilnehmende können fünf Phasen des Projektmanagements erklären.\u003c/p>\n\u003ch3>3) Behavioral\u003c/h3>\n\u003cp>\u003cstrong>Was wird verändert?\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Fähigkeiten\u003c/li>\n\u003cli>Fertigkeiten\u003c/li>\n\u003cli>beobachtbares Verhalten\u003c/li>\n\u003c/ul>\n\u003cp>Bsp.:\u003c/p>\n\u003cp>Teilnehmende wenden eine Feedback-Technik korrekt in Rollenspielen und später im Arbeitsalltag an.\u003c/p>\n\u003chr />\n\u003ch3>Affektiv = Fühlen\u003c/h3>\n\u003cul>\n\u003cli>Einstellungen\u003c/li>\n\u003cli>Motivation\u003c/li>\n\u003c/ul>\n\u003ch3>Kognitiv = Denken\u003c/h3>\n\u003cul>\n\u003cli>Wissen\u003c/li>\n\u003cli>Verstehen\u003c/li>\n\u003c/ul>\n\u003ch3>Behavioral = Handeln\u003c/h3>\n\u003cul>\n\u003cli>Verhalten\u003c/li>\n\u003cli>Fertigkeiten\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>Unterschiede\u003c/summary>\u003cdiv>\u003ch3>Kirkpatrick beantwortet:\u003c/h3>\n\u003cp>\u003cstrong>Wie wird der Erfolg eines Trainings gemessen?\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Reaktion\u003c/li>\n\u003cli>Lernen\u003c/li>\n\u003cli>Verhalten\u003c/li>\n\u003cli>Ergebnisse\u003c/li>\n\u003c/ul>\n\u003ch3>Kraiger et al. beantwortet:\u003c/h3>\n\u003cp>\u003cstrong>Welche Art von Lernergebnis soll das Training erreichen?\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Affektiv\u003c/li>\n\u003cli>Kognitiv\u003c/li>\n\u003cli>Behavioral\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/details>","10":"\u003cdetails class=\"note-section\">\u003csummary>Steiners Formel\u003c/summary>\u003cdiv>\u003ch3>Bestimmung der Gruppenleistung\u003c/h3>\n\u003cp>\u003cstrong>Tatsächliche Gruppenleistung = Potenzielle Gruppenleistung - Prozessverluste\u003c/strong>\u003c/p>\n\u003ch3>Tatsächliche Gruppenleistung\u003c/h3>\n\u003cp>Was leistet die Gruppe tatsächlich, wenn Prozessverluste während der Bearbeitung wirksam werden?\u003c/p>\n\u003ch3>Potenzielle Gruppenleistung\u003c/h3>\n\u003cp>Was könnte die Gruppe leisten, wenn alle Mitglieder ihr Bestes geben und die bestmögliche Leistungskombination stattfindet?\u003c/p>\n\u003ch3>Prozessverluste\u003c/h3>\n\u003cp>z.B. Motivations- oder Koordinationsverluste\u003c/p>\n\u003cp>Motivation sinkt, wenn z.B. die Eigenleistung nicht identifizierbar oder Beitrag zum Gesamtergebnis unklar ist.\u003c/p>\n\u003cp>Koordination ist suboptimal, z.B. ziehen nicht alle zur gleichen Zeit am Seil oder jeder zieht in eine etwas andere Richtung.\u003c/p>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>Motivationsverluste oder Motivationsgewinne?\u003c/summary>\u003cdiv>\u003ch3>Kann meine Einzelleistung erkannt werden?\u003c/h3>\n\u003ch3>Pfad 1: Ja, meine Leistung ist messbar\u003c/h3>\n\u003cul>\n\u003cli>Jeder kann sehen, was du geleistet hast.\u003c/li>\n\u003cli>Folge:\n\u003cul>\n\u003cli>du strengst dich mehr an\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003cp>= \u003cstrong>Soziale Erleichterung\u003c/strong>\u003c/p>\n\u003cp>Anwesenheit anderer führt dazu, dass man mehr Motivation zeigt und sich stärker anstrengt, weil die eigene Leistung beobachtet oder bewertet werden kann.\u003c/p>\n\u003ch3>Soziale Erleichterung (Social Facilitation)\u003c/h3>\n\u003cp>Die Anwesenheit bzw. erwartete Bewertung durch andere erhöht die Aktivierung.\u003c/p>\n\u003cp>Dadurch wird die Leistung bei einfachen Aufgaben besser, bei schwierigen Aufgaben schlechter.\u003c/p>\n\u003chr />\n\u003ch3>Pfad 2: Nein, meine Leistung ist nicht messbar\u003c/h3>\n\u003cul>\n\u003cli>Niemand erkennt deinen persönlichen Beitrag.\u003c/li>\n\u003c/ul>\n\u003cp>Bsp.:\u003c/p>\n\u003cp>Viele Personen schieben gemeinsam ein Auto.\u003c/p>\n\u003cp>Folge:\u003c/p>\n\u003cp>Einige denken:\u003c/p>\n\u003cp>„Ob ich mich voll anstrenge oder nicht, merkt sowieso keiner.“\u003c/p>\n\u003cp>→ Anwesenheit anderer allein führt nicht automatisch zu besserer Leistung.\u003c/p>\n\u003ch3>Soziales Faulenzen\u003c/h3>\n\u003cp>In einer Gruppe strengen sich einzelne Personen weniger an, weil ihr persönlicher Beitrag nicht erkennbar ist.\u003c/p>\n\u003ch3>Soziales Faulenzen (Social Loafing)\u003c/h3>\n\u003cp>Menschen strengen sich in der Gruppe weniger an, wenn ihr eigener Beitrag nicht erkennbar oder nicht bewertet wird.\u003c/p>\n\u003cp>Das führt zu einem Motivationsverlust und meist zu geringerer individueller Leistung.\u003c/p>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>Prozessmodell des Gruppendenkens nach Janis, 1982\u003c/summary>\u003cdiv>\u003cp>Erklärt, warum Gruppen manchmal schlechte Entscheidungen treffen, obwohl einzelne Mitglieder eigentlich kompetent sind.\u003c/p>\n\u003ch3>Ursachen und Kontext\u003c/h3>\n\u003cul>\n\u003cli>hohe Kohäsion\u003c/li>\n\u003cli>Abschottung von Außeninformationen\u003c/li>\n\u003cli>Mangel an Verfahren zur Entscheidungsfindung\u003c/li>\n\u003cli>direktive Führung\u003c/li>\n\u003cli>Druck um Einheitlichkeit\u003c/li>\n\u003cli>äußere Bedrohung / Zeitdruck / hoher Erfolgsdruck\u003c/li>\n\u003c/ul>\n\u003ch3>Übereinstimmungsdenken\u003c/h3>\n\u003cp>Gruppenmitglieder bevorzugen Einigkeit.\u003c/p>\n\u003cp>Man möchte nicht widersprechen.\u003c/p>\n\u003cp>Zweifel werden nicht oder weniger geäußert.\u003c/p>\n\u003ch3>Symptome des Gruppendenkens\u003c/h3>\n\u003cul>\n\u003cli>Überschätzung von Unverwundbarkeit\u003c/li>\n\u003cli>Rationalisierung\u003c/li>\n\u003cli>Glaube an die moralische Legitimität\u003c/li>\n\u003cli>Gruppendruck gegenüber Kritikern\u003c/li>\n\u003cli>Druck in Richtung Uniformität\u003c/li>\n\u003cli>Selbstzensur\u003c/li>\n\u003cli>Illusion der Einstimmigkeit\u003c/li>\n\u003c/ul>\n\u003ch3>Symptome einer unzulänglichen Entscheidungsfindung\u003c/h3>\n\u003cul>\n\u003cli>Versagen bei der Suche nach der besten Lösung\u003c/li>\n\u003cli>Durchspielen und Bewerten von Alternativen fehlt bzw. ist eingeschränkt\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Erklärt, warum Gruppen manchmal schlechte Entscheidungen treffen, obwohl einzelne Mitglieder eigentlich kompetent sind.\u003c/strong>\u003c/p>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>Strategien zur Vermeidung von Gruppendenken\u003c/summary>\u003cdiv>\u003ch3>Wie könnte man Gruppendenken vermeiden?\u003c/h3>\n\u003cul>\n\u003cli>Eine Person übernimmt \u003cstrong>Rolle des Kritikers\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>Unabhängige Experten\u003c/strong> hinzuziehen\u003c/li>\n\u003cli>Gruppe in \u003cstrong>Subgruppen\u003c/strong> unterteilen, die getrennt tagen\u003c/li>\n\u003cli>Nicht frühzeitig auf Entscheidung festlegen, sondern \u003cstrong>alle anhören\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/details>","11":"\u003cdetails class=\"note-section\">\u003csummary>Teamrollen nach Belbin\u003c/summary>\u003cdiv>\u003cp>Welche Rollen sollten in einem Team vertreten sein, damit das Team erfolgreich arbeitet?\u003c/p>\n\u003cp>Darum geht es.\u003c/p>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>1) Handlungsorientierte Rollen\u003c/summary>\u003cdiv>\u003cp>Diese Personen sorgen dafür, \u003cstrong>dass etwas passiert\u003c/strong>.\u003c/p>\n\u003ch3>Macher\u003c/h3>\n\u003cul>\n\u003cli>treibt Team an\u003c/li>\n\u003cli>setzt Ziele\u003c/li>\n\u003cli>arbeitet unter Druck gut\u003c/li>\n\u003c/ul>\n\u003ch3>Umsetzer\u003c/h3>\n\u003cul>\n\u003cli>plant praktische Umsetzung\u003c/li>\n\u003cli>arbeitet zuverlässig\u003c/li>\n\u003cli>arbeitet strukturiert\u003c/li>\n\u003c/ul>\n\u003ch3>Perfektionist\u003c/h3>\n\u003cul>\n\u003cli>achtet auf Details\u003c/li>\n\u003cli>findet Fehler\u003c/li>\n\u003cli>sorgt für hohe Qualität\u003c/li>\n\u003cli>kontrolliert alles sorgfältig\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>2) Wissensorientierte Rollen\u003c/summary>\u003cdiv>\u003cp>Diese Personen \u003cstrong>liefern Ideen und Fachwissen\u003c/strong>.\u003c/p>\n\u003ch3>Erfinder\u003c/h3>\n\u003cul>\n\u003cli>entwickelt kreative Ideen\u003c/li>\n\u003cli>löst schwierige Probleme\u003c/li>\n\u003cli>denkt unkonventionell\u003c/li>\n\u003c/ul>\n\u003ch3>Beobachter\u003c/h3>\n\u003cul>\n\u003cli>analysiert sachlich\u003c/li>\n\u003cli>bewertet Vor- und Nachteile\u003c/li>\n\u003cli>trifft überlegte Entscheidungen\u003c/li>\n\u003c/ul>\n\u003ch3>Spezialist\u003c/h3>\n\u003cul>\n\u003cli>besitzt tiefes Fachwissen\u003c/li>\n\u003cli>bringt Expertenwissen ein\u003c/li>\n\u003cli>konzentriert sich auf sein Fachgebiet\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>3) Kommunikationsorientierte Rollen\u003c/summary>\u003cdiv>\u003cp>Diese Personen sorgen für \u003cstrong>gute Zusammenarbeit\u003c/strong>.\u003c/p>\n\u003ch3>Koordinator\u003c/h3>\n\u003cul>\n\u003cli>verteilt Aufgaben\u003c/li>\n\u003cli>behält den Überblick\u003c/li>\n\u003cli>motiviert andere\u003c/li>\n\u003c/ul>\n\u003ch3>Teamarbeiter\u003c/h3>\n\u003cul>\n\u003cli>vermittelt bei Konflikten\u003c/li>\n\u003cli>unterstützt andere\u003c/li>\n\u003cli>sorgt für ein gutes Klima\u003c/li>\n\u003c/ul>\n\u003ch3>Wegbereiter / Weichensteller\u003c/h3>\n\u003cul>\n\u003cli>knüpft Kontakte\u003c/li>\n\u003cli>sucht Informationen\u003c/li>\n\u003cli>bringt neue Möglichkeiten ins Team\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Merksatz: Der Weichensteller öffnet Türen nach außen und bringt neue Möglichkeiten ins Team.\u003c/strong>\u003c/p>\n\u003cp>Im Teamrollenmodell nach Belbin ist der Weichensteller auch Resource Investigator / Wegbereiter die Rolle, die vor allem Kontakte knüpft und neue Möglichkeiten sucht.\u003c/p>\n\u003cp>Aufgaben des Weichenstellers:\u003c/p>\n\u003cul>\n\u003cli>sucht neue Ideen, Informationen und Chancen außerhalb des Teams\u003c/li>\n\u003cli>knüpft Kontakte zu anderen Personen oder Gruppen\u003c/li>\n\u003cli>bringt neue Impulse ins Team\u003c/li>\n\u003cli>erkennt Möglichkeiten und bringt sie ins Gespräch\u003c/li>\n\u003c/ul>\n\u003cp>Stärken:\u003c/p>\n\u003cul>\n\u003cli>offen\u003c/li>\n\u003cli>kommunikativ\u003c/li>\n\u003cli>neugierig\u003c/li>\n\u003cli>gut im Netzwerken\u003c/li>\n\u003c/ul>\n\u003cp>Schwäche:\u003c/p>\n\u003cul>\n\u003cli>kann manchmal schnell das Interesse verlieren oder Ideen nicht konsequent zu Ende verfolgen\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003cp>Ein erfolgreiches Team besteht nicht aus lauter gleichen Personen, sondern aus \u003cstrong>unterschiedlichen, sich ergänzenden Rollen\u003c/strong>.\u003c/p>\n\u003cp>Teamrollen sind keine festen Persönlichkeitstypen, sondern bevorzugte Verhaltensweisen.\u003c/p>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>Teamentwicklungsphasen nach Tuckman\u003c/summary>\u003cdiv>\u003cp>\u003cstrong>Wie entwickeln sich Teams typischerweise?\u003c/strong>\u003c/p>\n\u003cp>Beschreibt, wie sich Teams typisch entwickeln.\u003c/p>\n\u003chr />\n\u003ch3>1) Forming\u003c/h3>\n\u003cul>\n\u003cli>Team lernt sich kennen\u003c/li>\n\u003cli>alle höflich und vorsichtig\u003c/li>\n\u003cli>es herrscht Unsicherheit\u003c/li>\n\u003cli>Ziele und Rollen sind noch unklar\u003c/li>\n\u003c/ul>\n\u003ch3>Rolle der Führungskraft\u003c/h3>\n\u003cul>\n\u003cli>Orientierung geben\u003c/li>\n\u003cli>Ziele und Aufgaben erklären\u003c/li>\n\u003cli>Rollen und Erwartungen klar kommunizieren\u003c/li>\n\u003cli>Vertrauen aufbauen\u003c/li>\n\u003cli>Struktur schaffen\u003c/li>\n\u003c/ul>\n\u003cp>→ Viel führen und Orientierung geben.\u003c/p>\n\u003cp>\u003cstrong>Forming = anleiten\u003c/strong>\u003c/p>\n\u003chr />\n\u003ch3>2) Storming\u003c/h3>\n\u003cul>\n\u003cli>unterschiedliche Meinungen treffen aufeinander\u003c/li>\n\u003cli>es entstehen Konflikte um Aufgaben, Rollen oder Macht\u003c/li>\n\u003cli>manche versuchen, sich durchzusetzen\u003c/li>\n\u003c/ul>\n\u003ch3>Rolle der Führungskraft\u003c/h3>\n\u003cul>\n\u003cli>Konflikte nicht unterdrücken, sondern moderieren\u003c/li>\n\u003cli>alle Teammitglieder einbeziehen\u003c/li>\n\u003cli>dominante Personen bremsen\u003c/li>\n\u003cli>ruhigere fördern\u003c/li>\n\u003cli>bei Bedarf externe Moderation einsetzen\u003c/li>\n\u003cli>aushalten, dass es vorübergehend unruhig wird\u003c/li>\n\u003c/ul>\n\u003cp>→ Konflikte moderieren, nicht vermeiden.\u003c/p>\n\u003cp>\u003cstrong>Storming = moderieren\u003c/strong>\u003c/p>\n\u003chr />\n\u003ch3>3) Norming\u003c/h3>\n\u003cul>\n\u003cli>Team findet gemeinsame Regeln\u003c/li>\n\u003cli>Rollen sind geklärt\u003c/li>\n\u003cli>Vertrauen wächst\u003c/li>\n\u003cli>Zusammenarbeit verbessert sich\u003c/li>\n\u003c/ul>\n\u003ch3>Rolle der Führungskraft\u003c/h3>\n\u003cul>\n\u003cli>Regeln und Rollen mitgestalten\u003c/li>\n\u003cli>Eigenverantwortung fördern\u003c/li>\n\u003cli>gemeinsame Entscheidungen ermöglichen\u003c/li>\n\u003cli>weniger steuern\u003c/li>\n\u003cli>mehr begleiten\u003c/li>\n\u003c/ul>\n\u003cp>→ Begleiten, statt ständig eingreifen.\u003c/p>\n\u003cp>\u003cstrong>Norming = begleiten\u003c/strong>\u003c/p>\n\u003chr />\n\u003ch3>4) Performing\u003c/h3>\n\u003cul>\n\u003cli>Team arbeitet selbstständig\u003c/li>\n\u003cli>Zusammenarbeit funktioniert gut\u003c/li>\n\u003cli>hohe Produktivität und Zielorientierung\u003c/li>\n\u003c/ul>\n\u003ch3>Rolle der Führungskraft\u003c/h3>\n\u003cul>\n\u003cli>loslassen\u003c/li>\n\u003cli>nur noch Rahmenbedingungen schaffen\u003c/li>\n\u003cli>wenig Kontrolle\u003c/li>\n\u003cli>Leistung anerkennen und wertschätzen\u003c/li>\n\u003cli>Vertrauen und Freiraum geben\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Performing = delegieren und vertrauen\u003c/strong>\u003c/p>\n\u003chr />\n\u003ch3>5) Adjourning\u003c/h3>\n\u003cul>\n\u003cli>Projekt endet\u003c/li>\n\u003cli>Team löst sich auf\u003c/li>\n\u003cli>manche Mitglieder sind stolz\u003c/li>\n\u003cli>andere traurig\u003c/li>\n\u003c/ul>\n\u003ch3>Rolle der Führungskraft\u003c/h3>\n\u003cul>\n\u003cli>einen guten Abschluss gestalten\u003c/li>\n\u003cli>Erfolge feiern\u003c/li>\n\u003cli>Erfahrungen sichern\u003c/li>\n\u003cli>Wissen an die Organisation weitergeben\u003c/li>\n\u003cli>Mitglieder beim Übergang unterstützen\u003c/li>\n\u003c/ul>\n\u003cp>→ Das Team wertschätzend verabschieden und Erfahrungen sichern.\u003c/p>\n\u003cp>\u003cstrong>Adjourning = abschließen und reflektieren\u003c/strong>\u003c/p>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>Schritte im Teamentwicklungsprozess\u003c/summary>\u003cdiv>\u003cp>\u003cstrong>Wie entwickelt man Teams systematisch?\u003c/strong>\u003c/p>\n\u003cp>Beschreibt nicht die natürlichen Entwicklungsphasen, sondern wie man ein Team gezielt entwickelt und verbessert.\u003c/p>\n\u003cp>Wie läuft eine Arbeit mit Coach oder Führungskraft ab?\u003c/p>\n\u003chr />\n\u003ch3>1. Kontaktphase\u003c/h3>\n\u003cp>In der anfänglichen Kontaktphase sind die Erwartungen und Ziele der Teamentwicklung, das methodische Vorgehen, der organisatorische Rahmenbedingungen usw. zu klären.\u003c/p>\n\u003cp>Im Rahmen dieser Teamentwicklung ist Führungskraft und Team zu klären und Vergleich herzustellen.\u003c/p>\n\u003chr />\n\u003ch3>2. Diagnosephase\u003c/h3>\n\u003cp>Bevor eine Teamentwicklungsmaßnahme beginnt, sollten sich die an der Team beteiligten bzw. die Beratenden ein genaueres Bild über den Ist-Zustand des Teams und die aktuellen Teamprozesse machen.\u003c/p>\n\u003cp>Eine geeignete Maßnahme auswählen.\u003c/p>\n\u003chr />\n\u003ch3>3. Planungsphase\u003c/h3>\n\u003cp>Bei der Planung einer Teamentwicklung werden aus einer konkreten Ist-Situation heraus festgelegt:\u003c/p>\n\u003cul>\n\u003cli>Ziele\u003c/li>\n\u003cli>Inhalte\u003c/li>\n\u003cli>Vorgehensweisen\u003c/li>\n\u003c/ul>\n\u003cp>Es werden Übungen und Maßnahmen ausgewählt und zusammengestellt, die zu dem jeweiligen Team und seinen aktuellen Zielen passen.\u003c/p>\n\u003chr />\n\u003ch3>4. Durchführungsphase\u003c/h3>\n\u003cp>Jede Teamentwicklung sollte mit einer Motivierungsübung und mit Selbstverpflichtungen der Teilnehmenden abschließen.\u003c/p>\n\u003cp>Diese Maßnahmen unterstützen dadurch wieder Fortschritte im Team.\u003c/p>\n\u003chr />\n\u003ch3>5. Evaluation\u003c/h3>\n\u003cp>Erst ein bis drei Monate nach der Teammaßnahme sollte eine Evaluation vorgenommen werden.\u003c/p>\n\u003cp>Der Zeitraum dieser Bewertung richtet sich dabei auch nach der zeitlichen Perspektive der Maßnahmen.\u003c/p>\n\u003cp>Die jeweilige Teamveränderung sollte überprüft werden.\u003c/p>\n\u003cul>\n\u003cli>Was wurde erreicht?\u003c/li>\n\u003cli>Welche Ziele wurden erreicht?\u003c/li>\n\u003cli>Was hat funktioniert?\u003c/li>\n\u003cli>Was muss verändert werden?\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>Ansätze der Teamentwicklung\u003c/summary>\u003cdiv>\u003ch3>Outdoor-Training\u003c/h3>\n\u003cp>Gruppenaktivitäten in ungewohnter Umgebung, fördert Kohäsion und Vertrauen.\u003c/p>\n\u003cp>Transfer in den Arbeitsalltag ist jedoch umstritten.\u003c/p>\n\u003ch3>Survey-Feedback\u003c/h3>\n\u003cp>Diagnosedaten werden ans Team zurückgespielt und gemeinsam diskutiert.\u003c/p>\n\u003cp>Schafft Bewusstsein für Stärken und Schwächen und initiiert erste Veränderungen.\u003c/p>\n\u003ch3>Teamreflexivität\u003c/h3>\n\u003cp>Das Team reflektiert regelmäßig gemeinsame Ziele, Strategien und Prozesse und leitet daraus Anpassungen ab.\u003c/p>\n\u003cp>Transformationale Führung fördert diesen Prozess.\u003c/p>\n\u003ch3>Teamcoaching\u003c/h3>\n\u003cp>Nachhaltige Begleitung des Teams durch externe Unterstützung.\u003c/p>\n\u003cp>Fokus auf systematische Selbstreflexion und Verhaltensänderung im Arbeitsalltag.\u003c/p>\n\u003c/div>\u003c/details>","12":"\u003cdetails class=\"note-section\">\u003csummary>Konflikttypen\u003c/summary>\u003cdiv>\u003ch3>Sachkonflikte\u003c/h3>\n\u003cp>Entstehen aufgrund von \u003cstrong>unvereinbaren Verständnissen, Interpretationen von Fakten, unterschiedlichen Theorien und Wissen über die Welt\u003c/strong>.\u003c/p>\n\u003cp>Es geht um den \u003cstrong>Inhalt oder die Sache\u003c/strong>.\u003c/p>\n\u003cp>Worum genau geht es?\u003c/p>\n\u003chr />\n\u003ch3>Beziehungskonflikte\u003c/h3>\n\u003cp>Entstehen aufgrund von \u003cstrong>Selbstwertbedrohungen durch persönliche Verletzungen, Demütigung und Abwertung\u003c/strong>.\u003c/p>\n\u003cp>Wer hat Problem mit wem?\u003c/p>\n\u003cp>Betrifft Art und Weise der Zusammenarbeit.\u003c/p>\n\u003chr />\n\u003ch3>Prozesskonflikte\u003c/h3>\n\u003cp>Entstehen im Rahmen der organisatorischen Aspekte der Zusammenarbeit hinsichtlich:\u003c/p>\n\u003cul>\n\u003cli>Arbeitsteilung\u003c/li>\n\u003cli>Verantwortlichkeiten\u003c/li>\n\u003cli>Ressourcenverteilung\u003c/li>\n\u003c/ul>\n\u003cp>Es geht um:\u003c/p>\n\u003cul>\n\u003cli>Zuständigkeiten\u003c/li>\n\u003cli>Abläufe\u003c/li>\n\u003cli>Zeitteilungen\u003c/li>\n\u003cli>Wie wird zusammengearbeitet?\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>Brauchen wir Konflikte?\u003c/summary>\u003cdiv>\u003cp>Sachkonflikte können Leistung fördern.\u003c/p>\n\u003ch3>Entflechtung von Sach- und Beziehungskonflikten\u003c/h3>\n\u003ch3>Begünstigende Faktoren\u003c/h3>\n\u003cul>\n\u003cli>gemeinsame Ziele und geteilte Intentionen\u003c/li>\n\u003cli>psychologische Sicherheit\u003c/li>\n\u003cli>Diskussions-Normen\u003c/li>\n\u003cli>Historie positiver Konfliktbewältigung\u003c/li>\n\u003cli>Attribution auf Kontext vs. Person bzw. Interaktion\u003c/li>\n\u003cli>Konfliktmanagement\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>Eskalationsstufen nach Glasl\u003c/summary>\u003cdiv>\u003ch3>Grundprinzip\u003c/h3>\n\u003cp>Je weiter ein Konflikt fortgeschritten ist, desto weniger können die Konfliktparteien das Problem selbst lösen und desto mehr externe Unterstützung ist erforderlich.\u003c/p>\n\u003chr />\n\u003ch3>Phase 1: Win-Win\u003c/h3>\n\u003cp>\u003cstrong>Stufen 1-3\u003c/strong>\u003c/p>\n\u003cp>Eigenverantwortliche Lösung noch möglich.\u003c/p>\n\u003ch4>1. Verhärtung\u003c/h4>\n\u003cp>Erste Spannungen und Meinungsverschiedenheiten.\u003c/p>\n\u003ch4>2. Debatte / Polarisation\u003c/h4>\n\u003cp>Standpunkte verhärten sich.\u003c/p>\n\u003cp>Jeder möchte Recht behalten.\u003c/p>\n\u003ch4>3. Taten statt Worte\u003c/h4>\n\u003cp>Vertrauen sinkt.\u003c/p>\n\u003cp>Man redet weniger miteinander und handelt stattdessen.\u003c/p>\n\u003chr />\n\u003ch3>Phase 2: Win-Lose\u003c/h3>\n\u003cp>\u003cstrong>Stufen 4-6\u003c/strong>\u003c/p>\n\u003cp>Moderation oder Mediation erforderlich.\u003c/p>\n\u003ch4>4. Koalitionen\u003c/h4>\n\u003cp>Verbündete werden gesucht.\u003c/p>\n\u003cp>Gerüchte und Lagerbildungen entstehen.\u003c/p>\n\u003ch4>5. Gesichtsverlust\u003c/h4>\n\u003cp>Gegenseite wird öffentlich bloßgestellt oder persönlich angegriffen.\u003c/p>\n\u003ch4>6. Drohstrategien\u003c/h4>\n\u003cp>Drohungen oder anderer Druck.\u003c/p>\n\u003chr />\n\u003ch3>Phase 3: Lose-Lose\u003c/h3>\n\u003cp>\u003cstrong>Stufen 7-9\u003c/strong>\u003c/p>\n\u003cp>Machteingriff oder Trennung unvermeidlich.\u003c/p>\n\u003ch4>7. Begrenzte Vernichtungsschläge\u003c/h4>\n\u003ch4>8. Zersplitterung\u003c/h4>\n\u003ch4>9. Gemeinsam in den Abgrund / gemeinsame Vernichtung\u003c/h4>\n\u003cp>Beide Seiten nehmen Schaden in Kauf.\u003c/p>\n\u003cp>Eine Seite will gewinnen, die andere verlieren.\u003c/p>\n\u003chr />\n\u003ch3>Interventionen und Implikationen für Führungskräfte\u003c/h3>\n\u003cp>Grundregel:\u003c/p>\n\u003cp>Die Eskalationsstufe bestimmt die Interventionsform.\u003c/p>\n\u003cul>\n\u003cli>\n\u003cp>\u003cstrong>Stufen 1-3:\u003c/strong> Moderation durch die Führungskraft selbst möglich\u003c/p>\n\u003cul>\n\u003cli>offenes Gespräch suchen\u003c/li>\n\u003cli>Interessen klären\u003c/li>\n\u003cli>gemeinsame Lösung erarbeiten\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Stufen 4-6:\u003c/strong> Führungskraft ist häufig selbst beteiligt oder befangen\u003c/p>\n\u003cul>\n\u003cli>neutrale Mediation von außen erforderlich\u003c/li>\n\u003cli>Prozessbegleitung durch HR oder externe Fachkraft\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>Stufen 7-9:\u003c/strong> Eigenverantwortliche Lösung nicht mehr möglich\u003c/p>\n\u003cul>\n\u003cli>Machtentscheid durch die Hierarchie\u003c/li>\n\u003cli>rechtliche Schritte\u003c/li>\n\u003cli>Trennung der Parteien notwendig\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Kernbotschaft für Führungskräfte: Konflikte früh erkennen und intervenieren\u003c/strong>\u003c/p>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>Moderator und Mediator\u003c/summary>\u003cdiv>\u003ch3>Moderator\u003c/h3>\n\u003cp>Leitet ein Gespräch oder eine Besprechung neutral.\u003c/p>\n\u003cp>Gibt Struktur.\u003c/p>\n\u003ch3>Mediator\u003c/h3>\n\u003cp>Vermittelt zwischen Konfliktparteien und unterstützt sie dabei, selbst eine gemeinsame Lösung zu finden.\u003c/p>\n\u003cp>Macht keine eigene Lösung.\u003c/p>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>Konfliktmanagement auf Teamebene\u003c/summary>\u003cdiv>\u003ch3>Kooperatives Konfliktmanagement\u003c/h3>\n\u003cp>\u003cstrong>Integrieren\u003c/strong>\u003c/p>\n\u003cp>Lösung von Konflikten durch Ideenaustausch, Perspektivenübernahme, Ideenintegration, um gegenseitigen Nutzen und bestmögliche Lösung zu finden.\u003c/p>\n\u003cp>→ Beide gewinnen.\u003c/p>\n\u003cp>Es wird offen kommuniziert und nach einem Kompromiss oder einer gemeinsamen Lösung gesucht.\u003c/p>\n\u003chr />\n\u003ch3>Kompetitives Konfliktmanagement\u003c/h3>\n\u003cp>\u003cstrong>Dominieren\u003c/strong>\u003c/p>\n\u003cp>Konflikte werden als Gewinner-Verlierer-Kampf betrachtet.\u003c/p>\n\u003cul>\n\u003cli>ernsthafte Diskussionen\u003c/li>\n\u003cli>Versuch\u003c/li>\n\u003cli>Zwang aufzuerlegen\u003c/li>\n\u003c/ul>\n\u003cp>Eine Seite setzt sich durch.\u003c/p>\n\u003cp>Die andere verliert.\u003c/p>\n\u003chr />\n\u003ch3>Vermeidendes Konfliktmanagement\u003c/h3>\n\u003cp>\u003cstrong>Aus dem Weg gehen\u003c/strong>\u003c/p>\n\u003cp>Konflikten wird aus dem Weg gegangen.\u003c/p>\n\u003cp>Es wird geglättet und harmonisiert.\u003c/p>\n\u003cp>Diskussionen werden nicht offen oder gar nicht geführt.\u003c/p>\n\u003cp>Kann sinnvoll sein, wenn Konflikt unwichtig ist oder zuerst Zeit genommen werden soll.\u003c/p>\n\u003cp>Bsp.:\u003c/p>\n\u003cp>Zwei Kollegen sprechen ihren Streit nicht an und gehen sich stattdessen aus dem Weg.\u003c/p>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>Konfliktmanagement, förderlich oder hinderlich?\u003c/summary>\u003cdiv>\u003ch3>Kooperatives Konfliktmanagement\u003c/h3>\n\u003cp>Zusammenhang mit:\u003c/p>\n\u003cul>\n\u003cli>Performance\u003c/li>\n\u003cli>Zufriedenheit\u003c/li>\n\u003c/ul>\n\u003ch3>Kompetitives Konfliktmanagement\u003c/h3>\n\u003cp>Zusammenhang mit:\u003c/p>\n\u003cul>\n\u003cli>Performance\u003c/li>\n\u003cli>Zufriedenheit\u003c/li>\n\u003c/ul>\n\u003ch3>Vermeidendes Konfliktmanagement\u003c/h3>\n\u003cp>Zusammenhang mit:\u003c/p>\n\u003cul>\n\u003cli>Performance\u003c/li>\n\u003cli>Zufriedenheit\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>Konfliktmanagement, individuelle Ebene\u003c/summary>\u003cdiv>\u003cp>Achsen:\u003c/p>\n\u003cul>\n\u003cli>Fremddurchsetzung / Interesse an der anderen Partei\u003c/li>\n\u003cli>Selbstdurchsetzung / Berücksichtigung der eigenen Interessen\u003c/li>\n\u003c/ul>\n\u003ch3>Nachgeben\u003c/h3>\n\u003ch3>Integration\u003c/h3>\n\u003ch3>Kompromiss\u003c/h3>\n\u003ch3>Vermeiden\u003c/h3>\n\u003ch3>Durchsetzen\u003c/h3>\n\u003ch3>Integrative Diskussion\u003c/h3>\n\u003cp>Win-Win\u003c/p>\n\u003ch3>Distributiv\u003c/h3>\n\u003cp>Verteilung begrenzter Ressourcen\u003c/p>\n\u003cp>→ verteilen\u003c/p>\n\u003ch3>Integrativ\u003c/h3>\n\u003cp>Integrieren\u003c/p>\n\u003cp>\u003cstrong>Wie können beide gewinnen?\u003c/strong>\u003c/p>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>Konflikte ansprechen\u003c/summary>\u003cdiv>\u003ch3>SAG ES!\u003c/h3>\n\u003ch3>S: Sichtweise schildern\u003c/h3>\n\u003cul>\n\u003cli>neutrale Situationsschilderung\u003c/li>\n\u003cli>keine Interpretation\u003c/li>\n\u003c/ul>\n\u003cp>Beispiel:\u003c/p>\n\u003cp>„Mir ist aufgefallen, dass du im Teammeeting sehr ruhig gewesen bist.“\u003c/p>\n\u003ch3>A: Auswirkungen beschreiben\u003c/h3>\n\u003cp>Beispiel:\u003c/p>\n\u003cp>„Deine Inputs haben gefehlt. Das hat mich irritiert.“\u003c/p>\n\u003ch3>G: Gefühle benennen\u003c/h3>\n\u003cul>\n\u003cli>persönliche Gefühle nennen\u003c/li>\n\u003c/ul>\n\u003cp>Beispiel:\u003c/p>\n\u003cp>„Das hat mich verunsichert / enttäuscht.“\u003c/p>\n\u003ch3>E: Erfragen der Sicht des anderen\u003c/h3>\n\u003cul>\n\u003cli>Einbezug des Gegenübers\u003c/li>\n\u003c/ul>\n\u003cp>Beispiel:\u003c/p>\n\u003cp>„Wie siehst du das?“\u003c/p>\n\u003ch3>S: Schlussfolgerungen ziehen\u003c/h3>\n\u003cul>\n\u003cli>Wie wollen wir es in Zukunft handhaben?\u003c/li>\n\u003c/ul>\n\u003cp>Beispiel:\u003c/p>\n\u003cp>„Könntest du beim nächsten Mal ...“\u003c/p>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>Konstruktive Kontroverse\u003c/summary>\u003cdiv>\u003cp>Johnson &amp; Johnson (1979, 2015):\u003c/p>\n\u003cp>Strukturierte Methode, bei der Gruppen \u003cstrong>gegenteilige Positionen gezielt erarbeiten und austauschen\u003c/strong>.\u003c/p>\n\u003cp>Ziel:\u003c/p>\n\u003cp>Durch produktiven Widerspruch zu besseren Entscheidungen gelangen.\u003c/p>\n\u003chr />\n\u003ch3>Debatte\u003c/h3>\n\u003cp>\u003cstrong>Ziel: Sieg\u003c/strong>\u003c/p>\n\u003cp>Eine Seite gewinnt, die andere verliert.\u003c/p>\n\u003cp>Kritisches Denken im Dienst der eigenen Position.\u003c/p>\n\u003chr />\n\u003ch3>Streben nach Übereinstimmung\u003c/h3>\n\u003cp>\u003cstrong>Ziel: schnelle Einigung\u003c/strong>\u003c/p>\n\u003cp>Kritische Stimmen werden vermieden.\u003c/p>\n\u003cp>Gefahr:\u003c/p>\n\u003cul>\n\u003cli>Gruppendenken\u003c/li>\n\u003cli>Fehlentscheidungen\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch3>Konstruktive Kontroverse\u003c/h3>\n\u003cp>\u003cstrong>Ziel: beste Lösung\u003c/strong>\u003c/p>\n\u003cp>Widerspruch wird aktiv genutzt.\u003c/p>\n\u003cp>Dissens als Erkenntnisquelle.\u003c/p>\n\u003chr />\n\u003ch3>Voraussetzungen\u003c/h3>\n\u003cul>\n\u003cli>kooperative Grundhaltung\u003c/li>\n\u003cli>psychologische Sicherheit\u003c/li>\n\u003cli>Trennung von Person und Position\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>Konstruktive Kontroverse: 4 Phasen\u003c/summary>\u003cdiv>\u003ch3>1. Positionserarbeitung\u003c/h3>\n\u003cp>Zwei Untergruppen erarbeiten je eine Position mit Argumenten.\u003c/p>\n\u003cp>Ziel:\u003c/p>\n\u003cp>Ein \u003cstrong>überzeugender, gut begründeter Standpunkt\u003c/strong>.\u003c/p>\n\u003chr />\n\u003ch3>2. Präsentation &amp; Verteidigung\u003c/h3>\n\u003cp>Jede Gruppe präsentiert ihre Position.\u003c/p>\n\u003cp>Die andere hört aktiv zu und stellt Verständnisfragen, greift aber nicht an.\u003c/p>\n\u003chr />\n\u003ch3>3. Perspektivwechsel\u003c/h3>\n\u003cp>Die Gruppen tauschen die Positionen und vertreten nun die gegnerische Seite.\u003c/p>\n\u003cp>Erzwingt echtes Verstehen des anderen Standpunkts.\u003c/p>\n\u003cp>\u003cstrong>Rollentausch\u003c/strong>\u003c/p>\n\u003cp>Ziel:\u003c/p>\n\u003cp>Den anderen Standpunkt wirklich verstehen.\u003c/p>\n\u003cp>Ursprüngliche Positionen werden aufgegeben.\u003c/p>\n\u003chr />\n\u003ch3>4. Synthese\u003c/h3>\n\u003cp>Positionen werden abgelegt.\u003c/p>\n\u003cp>Gemeinsam wird die \u003cstrong>bestmögliche Lösung erarbeitet\u003c/strong>, gestützt auf alle Argumente beider Seiten.\u003c/p>\n\u003c/div>\u003c/details>","13":"\u003cdetails class=\"note-section\">\u003csummary>Hall&#x27;s Konzept (1983)\u003c/summary>\u003cdiv>\u003cul>\n\u003cli>\n\u003cp>Kultur ist oft \u003cstrong>unbewusst\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>unsichtbare Kontrollmechanismen operieren in unserem Gedanken\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\n\u003cp>Uns wird dieser \u003cstrong>Kontrollmechanismus erst bewusst, wenn wir ihn wirklich herausfordern\u003c/strong>, z.B. durch die Auseinandersetzung mit fremden Kulturen\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>Wir verhalten uns automatisch in solcher Art und Weise, wie es für die jeweilige Kultur angemessen ist\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003cp>Kultur wirkt meist unbewusst und steuert unser Denken und Verhalten, ohne dass wir es merken.\u003c/p>\n\u003cp>Menschen verhalten sich automatisch nach Normen ihrer eigenen Kultur.\u003c/p>\n\u003cblockquote>\n\u003cp>„Culture has always dictated where to draw the line separating one thing from another. These lines are arbitrary, but once learned and internalised they are treated as real.“\u003c/p>\n\u003c/blockquote>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>Hofstedes Kulturzwiebelmodell\u003c/summary>\u003cdiv>\u003ch3>Symbole\u003c/h3>\n\u003cp>Wörter, Farben, Artefakte mit einer besonderen Bedeutung.\u003c/p>\n\u003ch3>Helden\u003c/h3>\n\u003cp>Bewunderte Personen, die als Vorbilder dienen.\u003c/p>\n\u003ch3>Rituale\u003c/h3>\n\u003cp>Die Art und Weise, wie man jemand grüßt und Respekt zeigt.\u003c/p>\n\u003ch3>Werte\u003c/h3>\n\u003cp>Tendenz, bestimmte Situationen anderen Situationen vorzuziehen.\u003c/p>\n\u003ch3>Anwendung\u003c/h3>\n\u003cp>Sichtbare Anwendung mit unsichtbarer kultureller Bedeutung.\u003c/p>\n\u003cp>Breitet sich auf die anderen drei Schichten aus.\u003c/p>\n\u003cp>Von außen nach innen:\u003c/p>\n\u003cul>\n\u003cli>Symbole\u003c/li>\n\u003cli>Helden\u003c/li>\n\u003cli>Rituale\u003c/li>\n\u003cli>Werte\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>Eisberg-Konzept\u003c/summary>\u003cdiv>\u003ch3>Sinnlich, wahrnehmbar\u003c/h3>\n\u003cul>\n\u003cli>Literatur\u003c/li>\n\u003cli>Theater\u003c/li>\n\u003cli>Musik\u003c/li>\n\u003cli>Spiele\u003c/li>\n\u003cli>Festivals\u003c/li>\n\u003cli>Essen\u003c/li>\n\u003cli>Kleidung\u003c/li>\n\u003cli>Sprache\u003c/li>\n\u003cli>Begrüßungsrituale\u003c/li>\n\u003cli>Kommunikationsformen usw.\u003c/li>\n\u003c/ul>\n\u003ch3>Unbewusst, verborgen\u003c/h3>\n\u003cul>\n\u003cli>Werte und Normen\u003c/li>\n\u003cli>Kommunikationsstil\u003c/li>\n\u003cli>Einstellungen\u003c/li>\n\u003cli>Auffassungen\u003c/li>\n\u003cli>Gefühle\u003c/li>\n\u003cli>Verpflichtungen\u003c/li>\n\u003cli>Beziehungen\u003c/li>\n\u003cli>Erwartungen\u003c/li>\n\u003cli>Bedürfnisse\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>Kulturdimensionen nach Hofstede\u003c/summary>\u003cdiv>\u003ch3>Individualismus\u003c/h3>\n\u003cp>\u003cstrong>Kollektivismus ↔ Individualismus\u003c/strong>\u003c/p>\n\u003cp>Kollektivismus:\u003c/p>\n\u003cul>\n\u003cli>Gemeinschaft und Gruppeninteressen sind wichtiger\u003c/li>\n\u003cli>„Wir“\u003c/li>\n\u003c/ul>\n\u003cp>Individualismus:\u003c/p>\n\u003cul>\n\u003cli>Eigenständigkeit und persönliche Ziele stehen im Vordergrund\u003c/li>\n\u003cli>„Ich“\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch3>Machtdistanz\u003c/h3>\n\u003cp>\u003cstrong>Große Machtdistanz ↔ Kleine Machtdistanz\u003c/strong>\u003c/p>\n\u003cp>Große Machtdistanz:\u003c/p>\n\u003cul>\n\u003cli>Ungleichheiten und Hierarchien werden akzeptiert\u003c/li>\n\u003cli>Hierarchie\u003c/li>\n\u003c/ul>\n\u003cp>Kleine Machtdistanz:\u003c/p>\n\u003cul>\n\u003cli>Gleichheit und flache Hierarchien werden bevorzugt\u003c/li>\n\u003cli>Gleichheit\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch3>Maskulinität\u003c/h3>\n\u003cp>\u003cstrong>Feminität ↔ Maskulinität\u003c/strong>\u003c/p>\n\u003cp>Feminität:\u003c/p>\n\u003cul>\n\u003cli>Kooperation\u003c/li>\n\u003cli>Fürsorge\u003c/li>\n\u003cli>Lebensqualität stehen im Vordergrund\u003c/li>\n\u003cli>Fürsorge\u003c/li>\n\u003c/ul>\n\u003cp>Maskulinität:\u003c/p>\n\u003cul>\n\u003cli>Leistung\u003c/li>\n\u003cli>Wettbewerb\u003c/li>\n\u003cli>Erfolg sind wichtig\u003c/li>\n\u003cli>Leistung\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch3>Unsicherheitsvermeidung\u003c/h3>\n\u003cp>\u003cstrong>Starke Unsicherheitsvermeidung ↔ Schwache Unsicherheitsvermeidung\u003c/strong>\u003c/p>\n\u003cp>Starke Unsicherheitsvermeidung:\u003c/p>\n\u003cul>\n\u003cli>Wunsch nach klaren Regeln und Sicherheit\u003c/li>\n\u003cli>Regeln\u003c/li>\n\u003c/ul>\n\u003cp>Schwache Unsicherheitsvermeidung:\u003c/p>\n\u003cul>\n\u003cli>Offenheit für Veränderungen und Unsicherheit\u003c/li>\n\u003cli>Flexibilität\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch3>Zeitliche Orientierung\u003c/h3>\n\u003cp>\u003cstrong>Langzeitorientierung ↔ Kurzzeitorientierung\u003c/strong>\u003c/p>\n\u003cp>Langzeitorientierung:\u003c/p>\n\u003cul>\n\u003cli>Zukunft\u003c/li>\n\u003cli>Ausdauer\u003c/li>\n\u003cli>Sparsamkeit\u003c/li>\n\u003cli>Zukunft\u003c/li>\n\u003c/ul>\n\u003cp>Kurzzeitorientierung:\u003c/p>\n\u003cul>\n\u003cli>Traditionen\u003c/li>\n\u003cli>schnelle Ergebnisse\u003c/li>\n\u003cli>Gegenwart\u003c/li>\n\u003cli>Gegenwart / Tradition\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch3>Nachgiebigkeit und Beherrschung\u003c/h3>\n\u003cp>\u003cstrong>Nachgiebigkeitskultur ↔ Beherrschung\u003c/strong>\u003c/p>\n\u003cp>Nachgiebigkeitskultur:\u003c/p>\n\u003cul>\n\u003cli>Bedürfnisse und Lebensfreude werden eher ausgelebt\u003c/li>\n\u003cli>Genießen\u003c/li>\n\u003c/ul>\n\u003cp>Beherrschung:\u003c/p>\n\u003cul>\n\u003cli>Bedürfnisse werden kontrolliert und gesellschaftlichen Normen untergeordnet\u003c/li>\n\u003cli>Selbstkontrolle\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>Kulturdimensionen GLOBE\u003c/summary>\u003cdiv>\u003ch3>Unsicherheitsvermeidung\u003c/h3>\n\u003cp>Ausmaß des Verlassens auf etablierte soziale Normen.\u003c/p>\n\u003cul>\n\u003cli>Suche nach formalisierten Strukturen\u003c/li>\n\u003cli>Toleranz von Unsicherheit\u003c/li>\n\u003c/ul>\n\u003cp>→ Regeln\u003c/p>\n\u003chr />\n\u003ch3>Machtdistanz\u003c/h3>\n\u003cp>Ausmaß, in dem Mitglieder einer Gesellschaft erwarten / akzeptieren, dass Macht ungleich verteilt ist.\u003c/p>\n\u003cp>→ Hierarchie\u003c/p>\n\u003chr />\n\u003ch3>Institutional Collectivism\u003c/h3>\n\u003cp>Ausmaß, inwieweit gemeinsames Handeln oder gemeinsame Teilung von Ressourcen von der Gesellschaft gefördert und belohnt wird.\u003c/p>\n\u003cp>→ Teamarbeit\u003c/p>\n\u003chr />\n\u003ch3>Intra-Gruppen Kollektivismus\u003c/h3>\n\u003cp>Ausmaß, in dem Individuen Stolz und Loyalität gegenüber ihrer Familie / ihrem Unternehmen ausdrücken.\u003c/p>\n\u003cp>→ Loyalität\u003c/p>\n\u003chr />\n\u003ch3>Geschlechtergleichheit\u003c/h3>\n\u003cp>Ausmaß, in dem eine Gesellschaft Unterschiede in den Geschlechtern minimiert.\u003c/p>\n\u003cp>→ Gleichberechtigung\u003c/p>\n\u003cp>Unterschiede zwischen Männern und Frauen verringert werden.\u003c/p>\n\u003chr />\n\u003ch3>Bestimmtheit\u003c/h3>\n\u003cp>Ausmaß, in dem Individuen selbstbewusst, aggressiv oder konfrontativ auftreten.\u003c/p>\n\u003cp>→ Durchsetzen\u003c/p>\n\u003cp>Selbstbewusstes, direktes und durchsetzungsstarkes Auftreten.\u003c/p>\n\u003chr />\n\u003ch3>Zukunftsorientierung\u003c/h3>\n\u003cp>Ausmaß, in dem Individuen zukunftsorientierte Verhalten zeigen.\u003c/p>\n\u003cul>\n\u003cli>Planung\u003c/li>\n\u003cli>Investitionen\u003c/li>\n\u003c/ul>\n\u003cp>→ Planen\u003c/p>\n\u003cp>Fokus auf langfristige Planung, Investitionen und zukünftigen Erfolg.\u003c/p>\n\u003chr />\n\u003ch3>Leistungsorientierung\u003c/h3>\n\u003cp>Ausmaß, in dem Individuen für Leistungssteigerung oder Innovation belohnt werden.\u003c/p>\n\u003cp>→ Leistung\u003c/p>\n\u003cp>Leistung, Erfolg und Innovation werden anerkannt und belohnt.\u003c/p>\n\u003chr />\n\u003ch3>Soziale Orientierung\u003c/h3>\n\u003cp>Ausmaß, in dem faires und altruistisches Verhalten belohnt wird.\u003c/p>\n\u003cp>→ Hilfsbereitschaft\u003c/p>\n\u003cp>Freundlichkeit, Fairness und hilfsbereites Verhalten werden gefördert.\u003c/p>\n\u003chr />\n\u003c/div>\u003c/details>\n\u003cdetails class=\"note-section\">\u003csummary>Führungsdimensionen GLOBE\u003c/summary>\u003cdiv>\u003ch3>Charismatic / value-based\u003c/h3>\n\u003cp>Fähigkeit, andere zu motivieren / inspirieren.\u003c/p>\n\u003cp>Führungskraft motiviert und inspiriert andere durch Visionen und Werte.\u003c/p>\n\u003chr />\n\u003ch3>Team oriented\u003c/h3>\n\u003cp>Effektive Teambildung, Schaffung gemeinsamer Ziele.\u003c/p>\n\u003cp>Fördert Teamarbeit, Zusammenarbeit und gemeinsame Ziele.\u003c/p>\n\u003chr />\n\u003ch3>Participative\u003c/h3>\n\u003cp>Beteiligung anderer an Entscheidungen usw.\u003c/p>\n\u003cp>Bezieht Mitarbeitende aktiv in Entscheidungen ein.\u003c/p>\n\u003chr />\n\u003ch3>Human oriented\u003c/h3>\n\u003cp>Unterstützend, rücksichtsvoll, großzügig.\u003c/p>\n\u003cp>Handelt unterstützend, fürsorglich, rücksichtsvoll und großzügig.\u003c/p>\n\u003chr />\n\u003ch3>Autonomous\u003c/h3>\n\u003cp>Individualistisches, unabhängiges Verhalten.\u003c/p>\n\u003cp>Führt unabhängig und eigenständig.\u003c/p>\n\u003cp>Legt Wert auf Individualität.\u003c/p>\n\u003chr />\n\u003ch3>Self-protective\u003c/h3>\n\u003cp>Sicherheit des Individuums steht im Mittelpunkt.\u003c/p>\n\u003cp>Schützt sich selbst sowie den eigenen Status und achtet auf Sicherheit und Ansehen.\u003c/p>\n\u003c/div>\u003c/details>"};
const STORAGE_KEY = 'arbeitsorgi-progress-v2';
const state = {
  vl: 1,
  view: 'lernen',
  topicIndex: 0,
  mastered: {},
  cardIndex: 0,
  cardRevealed: false,
  cardOrder: [],
  quizIndex: 0,
  quizOrder: [],
  quizAnswered: false,
  quizChoice: null,
  quizScore: 0,
  quizWrong: []
};

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}
function topicsFor(vl) { return TOPICS.filter(topic => topic.vl === vl); }
function quizFor(vl) { return QUIZ.filter(question => question.vl === vl); }
function countDone(vl) { return topicsFor(vl).filter(topic => !!state.mastered[topic.id]).length; }
function shuffle(items) {
  const result = items.slice();
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}
function saveProgress() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.mastered)); } catch (_) {}
}
function loadProgress() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (saved && typeof saved === 'object' && !Array.isArray(saved)) state.mastered = saved;
  } catch (_) {}
}
function resetCard() {
  state.cardOrder = topicsFor(state.vl);
  state.cardIndex = 0;
  state.cardRevealed = false;
}
function resetQuiz() {
  state.quizOrder = shuffle(quizFor(state.vl));
  state.quizIndex = 0;
  state.quizAnswered = false;
  state.quizChoice = null;
  state.quizScore = 0;
  state.quizWrong = [];
}
function setLecture(vl) {
  if (!VL_LABELS[vl]) return;
  state.vl = vl;
  state.topicIndex = 0;
  resetCard();
  resetQuiz();
  render();
  window.scrollTo(0,0);
}

function renderNav() {
  return `<aside class="lecture-nav" aria-label="Vorlesungen">
    <h2 class="nav-heading">Vorlesungen</h2>
    <div class="lecture-list">${Object.keys(VL_LABELS).map(key => {
      const vl = Number(key);
      return `<button type="button" class="lecture-button" data-action="lecture" data-vl="${vl}" aria-current="${vl === state.vl}">
        <span class="lecture-button__main"><span class="lecture-button__number">VL ${String(vl).padStart(2,'0')}</span><span class="lecture-button__title">${escapeHtml(VL_LABELS[vl])}</span></span>
        <span class="lecture-button__count">${countDone(vl)}/${topicsFor(vl).length}</span>
      </button>`;
    }).join('')}</div>
    <button type="button" class="reset" data-action="reset">Lernstand zurücksetzen</button>
  </aside>`;
}
function renderMobileLecture() {
  return `<div class="mobile-lecture"><label for="lecture-select">Vorlesung wählen</label>
    <select class="selector" id="lecture-select">${Object.keys(VL_LABELS).map(key => {
      const vl = Number(key);
      return `<option value="${vl}" ${vl === state.vl ? 'selected':''}>VL ${vl}: ${escapeHtml(VL_LABELS[vl])}</option>`;
    }).join('')}</select></div>`;
}
function renderLearning() {
  const topics = topicsFor(state.vl);
  const index = Math.min(state.topicIndex, topics.length - 1);
  const topic = topics[index];
  if (!topic) return `<div class="empty">Für diese Vorlesung sind keine Themen vorhanden.</div>`;
  const done = !!state.mastered[topic.id];
  return `<div class="learning-grid">
    <div class="topic-panel"><div class="topic-heading"><span>Themen</span><span>${topics.length}</span></div>
      <div class="topic-list">${topics.map((item,i) => `<button type="button" class="topic-button" data-action="topic" data-index="${i}" aria-current="${i === index}">
        <span class="topic-num">${String(i+1).padStart(2,'0')}</span><span class="topic-name">${escapeHtml(item.title)}</span>${state.mastered[item.id] ? '<span class="topic-done" aria-label="Gelernt">✓</span>':''}</button>`).join('')}</div>
    </div>
    <div>
      <div class="mobile-topic"><label for="topic-select">Thema wählen</label><select class="selector" id="topic-select">${topics.map((item,i) => `<option value="${i}" ${i === index ? 'selected':''}>${i+1}. ${escapeHtml(item.title)}</option>`).join('')}</select></div>
      <article class="study-card" aria-labelledby="study-title">
        <div class="topic-index">Thema ${index+1} von ${topics.length}</div>
        <h3 class="study-title" id="study-title">${escapeHtml(topic.title)}</h3>
        <p class="study-lead">${topic.def}</p>
        <div class="key-points"><h3>Das ist wichtig</h3><ul>${topic.points.map(point => `<li>${point}</li>`).join('')}</ul></div>
        ${topic.tag ? `<p class="source-tag">Quelle in den Notizen: ${escapeHtml(topic.tag)}</p>`:''}
        <div class="card-footer">
          <div class="card-nav"><button type="button" class="quiet-button" data-action="prev-topic" ${index === 0 ? 'disabled':''}>← Zurück</button>
          <button type="button" class="quiet-button" data-action="next-topic" ${index === topics.length - 1 ? 'disabled':''}>Weiter →</button></div>
          <button type="button" class="${done ? 'success-button':'primary-button'}" data-action="toggle-done" aria-pressed="${done}">${done ? '✓ Als gelernt markiert':'Als gelernt markieren'}</button>
        </div>
      </article>
    </div>
  </div>
  <details class="notes-panel"><summary>Alle Notizen zu VL ${state.vl} lesen</summary>
    <p class="notes-help">Die vollständigen Notizen sind hier nach der Vorlesung geordnet. Die kurze Erklärung oben hilft beim Einstieg.</p>
    <div class="notes-content">${NOTE_HTML[state.vl] || ''}</div></details>`;
}
function renderCards() {
  const order = state.cardOrder;
  const i = state.cardIndex;
  if (i >= order.length) return `<div class="single-layout"><div class="single-card"><span class="eyebrow">Karteikarten</span><h3 class="study-title">Alle Karten durchgearbeitet</h3><p class="study-lead">Du kannst die Karten erneut durchgehen oder eine andere Vorlesung wählen.</p><button type="button" class="primary-button" data-action="restart-cards">Erneut lernen</button></div></div>`;
  const topic = order[i];
  return `<div class="single-layout"><div class="single-meta"><span>Karte ${i+1} von ${order.length}</span><span>VL ${state.vl}</span></div>
    <div class="single-card"><span class="eyebrow">Erkläre dir selbst</span><h3 class="flash-prompt">${escapeHtml(topic.title)}</h3>
      ${state.cardRevealed ? `<div class="flash-answer"><p>${topic.def}</p><ul>${topic.points.map(point => `<li>${point}</li>`).join('')}</ul></div>` : `<p class="flash-hint">Überlege kurz, was du noch weißt. Dann decke die Antwort auf.</p>`}
    </div><div class="action-row">${state.cardRevealed ? `<button type="button" class="quiet-button" data-action="card-again">Noch üben</button><button type="button" class="primary-button" data-action="card-know">Gewusst</button>` : `<button type="button" class="primary-button" data-action="reveal-card">Antwort zeigen</button>`}
      <button type="button" class="quiet-button" data-action="next-card">Überspringen →</button></div>
    <div class="action-row"><button type="button" class="quiet-button" data-action="shuffle-cards">Karten mischen</button></div>
  </div>`;
}
function renderQuiz() {
  const order = state.quizOrder;
  if (!order.length) return `<div class="empty">Für diese Vorlesung sind keine Quizfragen vorhanden.</div>`;
  if (state.quizIndex >= order.length) return `<div class="single-layout"><div class="single-card"><span class="eyebrow">Quiz beendet</span><h3 class="study-title">${state.quizScore} von ${order.length} richtig</h3>
    <p class="study-lead">${state.quizWrong.length ? 'Diese Fragen kannst du noch einmal üben:' : 'Du hast alle Fragen richtig beantwortet.'}</p>
    ${state.quizWrong.length ? `<ul>${state.quizWrong.map(q => `<li>${escapeHtml(q.q)}</li>`).join('')}</ul>`:''}
    <button type="button" class="primary-button" data-action="restart-quiz">Quiz wiederholen</button></div></div>`;
  const question = order[state.quizIndex];
  const letters = ['A','B','C','D'];
  return `<div class="single-layout"><div class="single-meta"><span>Frage ${state.quizIndex+1} von ${order.length}</span><span>${state.quizScore} richtig</span></div>
    <div class="single-card"><span class="eyebrow">VL ${state.vl} · Wissenscheck</span><h3 class="flash-prompt">${escapeHtml(question.q)}</h3>
      <div class="option-list">${question.opts.map((option,i) => {
        let cls = '';
        if (state.quizAnswered && i === question.correct) cls = ' correct';
        else if (state.quizAnswered && i === state.quizChoice) cls = ' incorrect';
        return `<button type="button" class="option${cls}" data-action="answer" data-index="${i}" ${state.quizAnswered ? 'disabled':''}><span class="option-letter">${letters[i]}</span><span>${escapeHtml(option)}</span></button>`;
      }).join('')}</div>
      ${state.quizAnswered ? `<div class="feedback"><strong>${state.quizChoice === question.correct ? 'Richtig.':'Die richtige Antwort ist markiert.'}</strong>${question.note ? ' '+escapeHtml(question.note):''}</div>
      <div class="action-row"><button type="button" class="primary-button" data-action="next-question">${state.quizIndex === order.length-1 ? 'Ergebnis ansehen':'Nächste Frage →'}</button></div>`:''}
    </div></div>`;
}
function render() {
  const total = TOPICS.length;
  const done = TOPICS.filter(topic => !!state.mastered[topic.id]).length;
  const percent = Math.round(done / total * 100);
  const lectureTotal = topicsFor(state.vl).length;
  const lectureDone = countDone(state.vl);
  const app = document.getElementById('app');
  app.innerHTML = `<div class="app-shell"><header class="site-header"><div><div class="brand-kicker">Arbeitsorganisation</div><h1 class="brand-title">Lernen, Schritt für Schritt.</h1></div>
    <div class="overall" aria-label="${done} von ${total} Themen gelernt"><span class="progress-ring" style="--angle:${percent}%"></span><span class="overall-copy"><strong>${percent}%</strong><span>${done} von ${total} Themen</span></span></div></header>
    <div class="layout">${renderNav()}<main class="main">${renderMobileLecture()}
      <div class="lecture-intro"><div><span class="eyebrow">Vorlesung ${String(state.vl).padStart(2,'0')} von 13</span><h2 class="lecture-title">${escapeHtml(VL_LABELS[state.vl])}</h2><p class="lecture-sub">Ein Thema nach dem anderen. In deinem Tempo.</p></div>
      <div class="lecture-progress"><strong>${lectureDone} / ${lectureTotal}</strong>gelernt<div class="mini-bar"><span style="width:${lectureTotal ? Math.round(lectureDone/lectureTotal*100):0}%"></span></div></div></div>
      <div class="mode-tabs" role="tablist" aria-label="Lernmodus">${[['lernen','Lernen'],['karten','Karteikarten'],['quiz','Quiz']].map(([value,label]) => `<button type="button" role="tab" class="mode-tab" data-action="view" data-view="${value}" aria-selected="${state.view===value}">${label}</button>`).join('')}</div>
      <div id="view-content">${state.view === 'lernen' ? renderLearning():state.view === 'karten' ? renderCards():renderQuiz()}</div>
    </main></div></div>`;
}

document.getElementById('app').addEventListener('click', event => {
  const button = event.target.closest('[data-action]');
  if (!button) return;
  const action = button.dataset.action;
  const topics = topicsFor(state.vl);
  if (action === 'lecture') setLecture(Number(button.dataset.vl));
  else if (action === 'view') { state.view = button.dataset.view; render(); }
  else if (action === 'topic') { state.topicIndex = Number(button.dataset.index); render(); }
  else if (action === 'prev-topic') { state.topicIndex = Math.max(0,state.topicIndex-1); render(); }
  else if (action === 'next-topic') { state.topicIndex = Math.min(topics.length-1,state.topicIndex+1); render(); }
  else if (action === 'toggle-done') {
    const id = topics[state.topicIndex].id;
    if (state.mastered[id]) delete state.mastered[id]; else state.mastered[id] = true;
    saveProgress(); render();
  }
  else if (action === 'reset') {
    if (confirm('Den gesamten Lernstand wirklich zurücksetzen?')) { state.mastered = {}; saveProgress(); render(); }
  }
  else if (action === 'reveal-card') { state.cardRevealed = true; render(); }
  else if (action === 'card-again' || action === 'card-know' || action === 'next-card') {
    if (action !== 'next-card') {
      const id = state.cardOrder[state.cardIndex].id;
      if (action === 'card-know') state.mastered[id] = true; else delete state.mastered[id];
      saveProgress();
    }
    state.cardIndex++; state.cardRevealed = false; render();
  }
  else if (action === 'shuffle-cards') { state.cardOrder = shuffle(topics); state.cardIndex = 0; state.cardRevealed = false; render(); }
  else if (action === 'restart-cards') { resetCard(); render(); }
  else if (action === 'answer' && !state.quizAnswered) {
    state.quizChoice = Number(button.dataset.index);
    state.quizAnswered = true;
    const question = state.quizOrder[state.quizIndex];
    if (state.quizChoice === question.correct) state.quizScore++;
    else state.quizWrong.push(question);
    render();
  }
  else if (action === 'next-question' && state.quizAnswered) {
    state.quizIndex++; state.quizChoice = null; state.quizAnswered = false; render();
  }
  else if (action === 'restart-quiz') { resetQuiz(); render(); }
});
document.getElementById('app').addEventListener('change', event => {
  if (event.target.id === 'lecture-select') setLecture(Number(event.target.value));
  if (event.target.id === 'topic-select') { state.topicIndex = Number(event.target.value); render(); }
});
loadProgress();
resetCard();
resetQuiz();
render();

</script>
</body>
</html>
